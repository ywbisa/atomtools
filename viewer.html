<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATOM Daily Tracker - TV Wallboard</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23121212'/><text x='50%' y='68%' font-family='sans-serif' font-weight='900' font-size='52' fill='%23D1C2A5'>DT</text></svg>">

  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: #141418;
      --border-color: #27272a;
      --brand-beige: #e2d4bc;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      /* Google Sheets Palette (Restored) */
      --gs-header-bg: #4a6585;      /* Steel blue header for crisp white text */
      --gs-header-text: #ffffff;    /* Pure white header text */
      --gs-row-odd: #ffffff;        /* White row */
      --gs-row-even: #f3f3f3;       /* Light gray row */
      --gs-border: #d9d9d9;
      --gs-total-bg: #e0e0e0;
    }

    * { box-sizing: border-box; }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
      background-color: var(--bg-color); 
      color: var(--text-main);
      margin: 0;
      padding: 14px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* TOP TV STATUS BAR */
    .brand-header {
      width: 100%;
      max-width: 1920px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border-color);
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-title {
      font-weight: 900;
      font-size: 26px;
      letter-spacing: 2px;
      color: var(--brand-beige);
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      border-left: 2px solid #334155;
      padding-left: 12px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .page-indicator-badge {
      font-size: 13px;
      color: var(--brand-beige);
      background: #18181b;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .status-badge {
      font-size: 13px;
      color: #4ade80;
      background: #18181b;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #27272a;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* MAIN TV CARD CONTAINER */
    .card { 
      background: var(--card-bg); 
      padding: 16px 20px; 
      border-radius: 10px; 
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 1920px; 
      flex: 1;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .card-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }

    .card-title {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 24px;
      background-color: var(--brand-beige);
      border-radius: 2px;
    }

    .report-meta {
      font-size: 15px;
      color: var(--text-muted);
      font-weight: 600;
      background: #18181b;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #27272a;
    }

    /* FULL WIDTH TABLE CONTAINER */
    .table-container {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
      border-radius: 6px;
      border: 1px solid var(--gs-border);
      overflow: hidden;
    }

    table { 
      width: 100%; 
      table-layout: fixed;
      border-collapse: collapse;
      border-spacing: 0;
      background-color: #ffffff;
    }

    /* COLUMN WIDTH LOCKS (Prevents shifting on TV across pages) */
    .col-assignee { width: 23%; }
    .col-succ     { width: 9%; }
    .col-den      { width: 9%; }
    .col-ref      { width: 10%; }
    .col-cool     { width: 8%; }
    .col-esc      { width: 8%; }
    .col-exp      { width: 8%; }
    .col-total    { width: 13%; }
    .col-win      { width: 12%; }

    /* TABLE CELLS: Pure black text for high readability on white/gray rows */
    th, td { 
      border-right: 1px solid var(--gs-border);
      border-bottom: 1px solid var(--gs-border);
      padding: 13px 10px; 
      text-align: center; 
      font-size: 21px;
      line-height: 1.25;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #000000;
    }

    th:last-child, td:last-child {
      border-right: none;
    }

    /* WHITE TEXT HEADERS ON STEEL BLUE */
    th { 
      background-color: var(--gs-header-bg); 
      color: var(--gs-header-text); 
      padding: 14px 8px; 
      font-weight: 800;
      font-size: 17px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    th.assignee-header {
      text-align: left;
      padding-left: 20px;
    }

    /* ALTERNATING WHITE & GRAY ROWS */
    tbody tr:nth-child(even) td { 
      background-color: var(--gs-row-even); 
    }
    
    tbody tr:nth-child(odd) td { 
      background-color: var(--gs-row-odd); 
    }

    .text-left { 
      text-align: left; 
      font-weight: 700; 
      color: #000000;
      padding-left: 20px;
    }

    .metric-num {
      font-weight: 500;
      color: #000000;
    }

    .total-disputed-cell {
      font-weight: 800;
      color: #000000;
    }

    /* WINRATE: Plain black text without colored badge boxes */
    .winrate-cell {
      font-weight: 800;
      color: #000000;
    }

    /* PINNED GRAND TOTAL FOOTER */
    tfoot tr td { 
      font-weight: 900; 
      background-color: var(--gs-total-bg) !important; 
      color: #000000;
      border-top: 2px solid #000000;
      border-bottom: none;
      padding: 14px 10px;
      font-size: 22px;
    }

    tfoot tr td.text-left {
      color: #000000;
      font-size: 22px;
    }

    /* SMOOTH TV ROTATION TRANSITION */
    .fade-switch {
      animation: fadeInRow 0.35s ease-in-out;
    }

    @keyframes fadeInRow {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .empty-state {
      padding: 80px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 20px;
      font-weight: 600;
      background: #18181b;
      border-radius: 4px;
    }

    .brand-footer {
      margin-top: 10px;
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- TV TOP BAR -->
  <div class="brand-header">
    <div class="brand-left">
      <div class="brand-title">ATOMS Daily Tracker</div>
      <div class="brand-subtitle">Operations Live Board</div>
    </div>
    <div class="header-right">
      <div class="page-indicator-badge" id="pageIndicator">Loading...</div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span id="badgeText">Live Feed Active</span>
      </div>
    </div>
  </div>

  <!-- MAIN CARD CONTAINER -->
  <div class="card">
    <div class="card-top-bar">
      <div>
        <div class="card-title" id="reportTitle">Daily Ticket Summary</div>
      </div>
      <div class="report-meta" id="reportMeta">Connecting live stream...</div>
    </div>

    <div class="table-container" id="output">
      <div class="empty-state">Waiting for report upload from Admin...</div>
    </div>
  </div>

  <div class="brand-footer">
    ATOMS Operations &bull; Real-Time Operations Display &copy; 2026
  </div>

<script>
const SYNC_TOPIC = "ywbisa_tracker_live_sync";
let lastChecksum = "";

// TV ROTATION SETTINGS
const ROWS_PER_PAGE = 10;      // 10 Agents per page keeps text large and readable on TV
const ROTATION_INTERVAL = 8000; // Cycles every 8 seconds
let currentPage = 0;
let cachedRows = [];
let cachedTotals = null;
let rotationTimer = null;

function pollCloudData() {
  const url = `https://ntfy.sh/${SYNC_TOPIC}/json?poll=1&since=24h&_t=${Date.now()}`;

  if (typeof fetch === 'function') {
    fetch(url)
      .then(res => {
        if (!res.ok) throw new Error("Status " + res.status);
        return res.text();
      })
      .then(text => processResponse(text))
      .catch(() => tryXHR(url));
  } else {
    tryXHR(url);
  }
}

function tryXHR(url) {
  try {
    const xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4 && xhr.status === 200) {
        processResponse(xhr.responseText);
      }
    };
    xhr.send();
  } catch(e) {}
}

function processResponse(rawText) {
  if (!rawText || !rawText.trim()) return;

  const lines = rawText.trim().split('\n');
  for (let i = lines.length - 1; i >= 0; i--) {
    try {
      const item = JSON.parse(lines[i]);
      if (item.event === 'message' && item.message) {
        const payload = (typeof item.message === 'string') ? JSON.parse(item.message) : item.message;
        renderReport(payload);
        break;
      }
    } catch(e) {}
  }
}

function renderReport(payload) {
  if (!payload) return;

  const currentChecksum = JSON.stringify(payload);
  if (currentChecksum === lastChecksum) return; 
  lastChecksum = currentChecksum;

  const meta = document.getElementById('reportMeta');
  const title = document.getElementById('reportTitle');

  if (payload.day) {
    title.textContent = `Daily Ticket Summary — Day ${payload.day} (PHT)`;
  }
  meta.textContent = payload.updatedAt ? `Last Broadcast: ${payload.updatedAt}` : 'Live Report Active';

  // UNPACKING ENGINE: Handles both array and object formats
  let rows = [];
  if (Array.isArray(payload.rows)) {
    rows = payload.rows;
  } else if (Array.isArray(payload.r)) {
    rows = payload.r.map(row => ({
      name: row[0],
      successful: row[1],
      denied: row[2],
      refunded: row[3],
      coolOff: row[4],
      escalated: row[5],
      expired: row[6],
      totalDispute: row[7],
      winRate: row[8]
    }));
  }

  // Pre-calculate team Grand Totals
  let totals = { succ: 0, den: 0, ref: 0, cool: 0, esc: 0, exp: 0, total: 0 };
  rows.forEach(row => {
    const s = Number(row.successful) || 0;
    const d = Number(row.denied) || 0;
    const r = Number(row.refunded) || 0;
    const c = Number(row.coolOff) || 0;
    const e = Number(row.escalated) || 0;
    const x = Number(row.expired) || 0;
    const t = (row.totalDispute !== undefined && !isNaN(Number(row.totalDispute))) 
              ? Number(row.totalDispute) 
              : (s + d + r + c + e);

    totals.succ += s;
    totals.den += d;
    totals.ref += r;
    totals.cool += c;
    totals.esc += e;
    totals.exp += x;
    totals.total += t;
  });

  const overallWinRateDenom = totals.succ + totals.den + totals.cool;
  totals.overallWinRate = overallWinRateDenom > 0 ? (totals.succ / overallWinRateDenom * 100).toFixed(2) : "0.00";

  cachedRows = rows;
  cachedTotals = totals;
  currentPage = 0;

  buildTableShell();
  renderCurrentPage();

  if (rotationTimer) clearInterval(rotationTimer);
  if (cachedRows.length > ROWS_PER_PAGE) {
    rotationTimer = setInterval(nextPage, ROTATION_INTERVAL);
  }
}

function buildTableShell() {
  const outputDiv = document.getElementById('output');
  if (!cachedRows || cachedRows.length === 0) {
    outputDiv.innerHTML = `<div class="empty-state">No matching rows found in this report.</div>`;
    document.getElementById('pageIndicator').textContent = '0 Agents';
    return;
  }

  outputDiv.innerHTML = `
    <table id="summaryTable">
      <colgroup>
        <col class="col-assignee">
        <col class="col-succ">
        <col class="col-den">
        <col class="col-ref">
        <col class="col-cool">
        <col class="col-esc">
        <col class="col-exp">
        <col class="col-total">
        <col class="col-win">
      </colgroup>
      <thead>
        <tr>
          <th class="assignee-header">Assignee</th>
          <th>Successful</th>
          <th>Denied</th>
          <th>Already Refunded</th>
          <th>Cool Off</th>
          <th>Escalated</th>
          <th>Expired</th>
          <th>Total Disputed</th>
          <th>Winrate</th>
        </tr>
      </thead>
      <tbody id="pagedTbody">
        <!-- Rows dynamically injected here -->
      </tbody>
      <tfoot>
        <tr class="summary-row">
          <td class="text-left">Grand Total</td>
          <td class="metric-num">${cachedTotals.succ}</td>
          <td class="metric-num">${cachedTotals.den}</td>
          <td class="metric-num">${cachedTotals.ref}</td>
          <td class="metric-num">${cachedTotals.cool}</td>
          <td class="metric-num">${cachedTotals.esc}</td>
          <td class="metric-num">${cachedTotals.exp}</td>
          <td class="total-disputed-cell">${cachedTotals.total}</td>
          <td class="winrate-cell">${cachedTotals.overallWinRate}%</td>
        </tr>
      </tfoot>
    </table>
  `;
}

function renderCurrentPage() {
  const tbody = document.getElementById('pagedTbody');
  const indicator = document.getElementById('pageIndicator');
  if (!tbody || !cachedRows || cachedRows.length === 0) return;

  const totalPages = Math.ceil(cachedRows.length / ROWS_PER_PAGE);
  indicator.textContent = `Page ${currentPage + 1} of ${totalPages} • ${cachedRows.length} Agents`;

  const start = currentPage * ROWS_PER_PAGE;
  const end = start + ROWS_PER_PAGE;
  const pageSlice = cachedRows.slice(start, end);

  let rowsHtml = '';
  pageSlice.forEach(row => {
    const s = Number(row.successful) || 0;
    const d = Number(row.denied) || 0;
    const r = Number(row.refunded) || 0;
    const c = Number(row.coolOff) || 0;
    const e = Number(row.escalated) || 0;
    const x = Number(row.expired) || 0;
    const t = (row.totalDispute !== undefined && !isNaN(Number(row.totalDispute))) 
              ? Number(row.totalDispute) 
              : (s + d + r + c + e);
    const w = typeof row.winRate === 'number' ? row.winRate.toFixed(2) : parseFloat(row.winRate || 0).toFixed(2);

    rowsHtml += `
      <tr class="fade-switch">
        <td class="text-left">${row.name}</td>
        <td class="metric-num">${s}</td>
        <td class="metric-num">${d}</td>
        <td class="metric-num">${r}</td>
        <td class="metric-num">${c}</td>
        <td class="metric-num">${e}</td>
        <td class="metric-num">${x}</td>
        <td class="total-disputed-cell">${t}</td>
        <td class="winrate-cell">${w}%</td>
      </tr>
    `;
  });

  tbody.innerHTML = rowsHtml;
}

function nextPage() {
  if (!cachedRows || cachedRows.length <= ROWS_PER_PAGE) return;
  const totalPages = Math.ceil(cachedRows.length / ROWS_PER_PAGE);
  currentPage = (currentPage + 1) % totalPages;
  renderCurrentPage();
}

pollCloudData();
setInterval(pollCloudData, 4000);

window.addEventListener('storage', (e) => {
  if (e.key === 'atom_tracker_live_data' && e.newValue) {
    try { renderReport(JSON.parse(e.newValue)); } catch(err) {}
  }
});

try {
  new BroadcastChannel('atom_tracker_live_channel').onmessage = (e) => {
    if (e.data) renderReport(e.data);
  };
} catch(e) {}
</script>
</body>
</html>
