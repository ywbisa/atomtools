<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATOM Daily Tracker</title>
  
  <!-- BROWSER TAB ICON (FAVICON) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23121212'/><text x='50%' y='68%' font-family='sans-serif' font-weight='900' font-size='52' fill='%23D1C2A5' text-anchor='middle'>DT</text></svg>">

  <style>
    :root {
      --bg-color: #080808;
      --card-bg: #121212;
      --border-color: #262626;
      --brand-beige: #D1C2A5;
      --text-main: #EEEEEE;
      --text-muted: #888888;
      --table-row-even: #161616;
      --accent-blue: #3b82f6;
    }

    * { box-sizing: border-box; }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background-color: var(--bg-color); 
      color: var(--text-main);
      margin: 0;
      padding: 20px 12px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ATOMS BRAND HEADER */
    .brand-header {
      width: 100%;
      max-width: 950px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-title {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 2px;
      color: var(--brand-beige);
      text-transform: uppercase;
    }

    .status-badge {
      font-size: 10px;
      color: #22c55e;
      background: #1a1a1a;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 5px #22c55e;
    }

    /* CARD CONTAINER */
    .card { 
      background: var(--card-bg); 
      padding: 16px 18px; 
      border-radius: 10px; 
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
      width: 100%;
      max-width: 950px; 
    }

    .card-title {
      margin-top: 0;
      margin-bottom: 14px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: var(--brand-beige);
      border-radius: 2px;
    }

    /* CONTROLS SECTION */
    .controls { 
      display: flex; 
      gap: 16px; 
      align-items: flex-end; 
      margin-bottom: 16px;
      background: #1a1a1a;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      flex-wrap: wrap;
    }

    .control-group { 
      display: flex; 
      flex-direction: column; 
      gap: 4px; 
      font-size: 11px;
      color: var(--text-muted);
    }

    /* DRAG & DROP ZONE STYLES */
    .drop-zone {
      border: 2px dashed var(--border-color);
      border-radius: 6px;
      padding: 10px 16px;
      text-align: center;
      background-color: #080808;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 200px;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--brand-beige);
      background-color: #141414;
    }

    .drop-zone-text {
      font-size: 11px;
      color: var(--text-muted);
    }

    .drop-zone-text span {
      color: var(--brand-beige);
      font-weight: 600;
    }

    input[type="file"] {
      display: none;
    }

    input[type="number"] { 
      padding: 4px 8px; 
      border: 1px solid var(--border-color); 
      border-radius: 4px; 
      font-size: 11px; 
      background-color: #080808;
      color: var(--text-main);
      width: 65px;
      height: 27px;
    }

    button { 
      background-color: var(--brand-beige); 
      color: #080808; 
      border: none; 
      padding: 0 16px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-weight: 700; 
      font-size: 11px; 
      height: 27px;
      transition: opacity 0.2s ease;
    }

    button:hover { 
      opacity: 0.85; 
    }

    #status { 
      margin-bottom: 10px; 
      font-weight: 600; 
      font-size: 11px; 
    }

    /* COMPACT TABLE STYLES */
    .table-container {
      width: 100%;
      overflow-x: auto;
    }

    table { 
      width: 100%; 
      border-collapse: separate; 
      border-spacing: 0;
      font-size: 11px; 
      color: var(--text-main);
    }

    th { 
      background-color: #1a1a1a; 
      color: var(--brand-beige); 
      padding: 6px 8px; 
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-size: 9px;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      text-align: center; 
    }

    th:first-child { border-top-left-radius: 5px; border-bottom-left-radius: 5px; }
    th:last-child { border-top-right-radius: 5px; border-bottom-right-radius: 5px; }

    td { 
      padding: 5px 8px; 
      border-bottom: 1px solid #1f1f1f; 
      text-align: center; 
      line-height: 1.2;
    }

    tr:nth-child(even) td { 
      background-color: var(--table-row-even); 
    }

    tr:hover td {
      background-color: #222222;
    }

    .text-left { 
      text-align: left !important; 
      font-weight: 600; 
      color: var(--text-main);
    }

    .summary-row td { 
      font-weight: bold; 
      background-color: #1c1917 !important; 
      color: var(--brand-beige);
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 6px 8px;
    }

    /* FOOTER BRANDING */
    .brand-footer {
      margin-top: 28px;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- TOP BRAND HEADER -->
  <div class="brand-header">
    <div class="brand-title">ATOMS Daily Tracker</div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>100% Offline Mode</span>
    </div>
  </div>

  <!-- MAIN DASHBOARD CARD -->
  <div class="card">
    <div class="card-title">Ticket Summary Processor</div>
    
    <div class="controls">
      <div class="control-group">
        <label><b>Upload CSV File:</b></label>
        <div class="drop-zone" id="dropZone">
          <div class="drop-zone-text" id="dropZoneText">Drag & drop CSV here or <span>browse</span></div>
          <input type="file" id="csvFile" accept=".csv">
        </div>
      </div>

      <div class="control-group">
        <label><b>Target Day (PHT Date):</b></label>
        <input type="number" id="targetDay" value="" min="1" max="31">
      </div>

      <button onclick="processCSV()">Process Report</button>
    </div>

    <div id="status"></div>
    <div class="table-container" id="output">
      <p style="font-size: 11px; color: var(--text-muted);">Upload or drop a CSV file above to generate summary locally.</p>
    </div>
  </div>

  <div class="brand-footer">
    ATOMS Local Operations &copy; 2026
  </div>

<script>
// RFC 4180 Compliant CSV Parser
function parseCSV(text) {
  const rows = [];
  let currentRow = [];
  let currentVal = '';
  let insideQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const nextChar = text[i + 1];

    if (char === '"') {
      if (insideQuotes && nextChar === '"') {
        currentVal += '"';
        i++;
      } else {
        insideQuotes = !insideQuotes;
      }
    } else if (char === ',' && !insideQuotes) {
      currentRow.push(currentVal.trim());
      currentVal = '';
    } else if ((char === '\r' || char === '\n') && !insideQuotes) {
      if (char === '\r' && nextChar === '\n') {
        i++;
      }
      currentRow.push(currentVal.trim());
      if (currentRow.length > 1 || currentRow[0] !== '') {
        rows.push(currentRow);
      }
      currentRow = [];
      currentVal = '';
    } else {
      currentVal += char;
    }
  }

  if (currentVal || currentRow.length > 0) {
    currentRow.push(currentVal.trim());
    rows.push(currentRow);
  }

  return rows;
}

function cleanStr(val) {
  if (!val) return '';
  return val.toString().replace(/^['"\s\ufeff]+|['"\s]+$/g, '').trim();
}

// DRAG AND DROP HANDLERS
const dropZone = document.getElementById('dropZone');
const csvFileInput = document.getElementById('csvFile');
const dropZoneText = document.getElementById('dropZoneText');

dropZone.addEventListener('click', () => csvFileInput.click());

csvFileInput.addEventListener('change', () => {
  if (csvFileInput.files.length) {
    updateDropZoneLabel(csvFileInput.files[0].name);
  }
});

['dragenter', 'dragover'].forEach(eventName => {
  dropZone.addEventListener(eventName, (e) => {
    e.preventDefault();
    e.stopPropagation();
    dropZone.classList.add('dragover');
  }, false);
});

['dragleave', 'drop'].forEach(eventName => {
  dropZone.addEventListener(eventName, (e) => {
    e.preventDefault();
    e.stopPropagation();
    dropZone.classList.remove('dragover');
  }, false);
});

dropZone.addEventListener('drop', (e) => {
  const dt = e.dataTransfer;
  const files = dt.files;

  if (files.length) {
    if (files[0].name.endsWith('.csv')) {
      csvFileInput.files = files;
      updateDropZoneLabel(files[0].name);
    } else {
      alert("Please drop a valid .csv file!");
    }
  }
});

function updateDropZoneLabel(filename) {
  dropZoneText.innerHTML = `Loaded: <span>${filename}</span>`;
}

function processCSV() {
  const fileInput = document.getElementById('csvFile');
  const targetDay = parseInt(document.getElementById('targetDay').value, 10);
  const statusDiv = document.getElementById('status');
  
  if (!fileInput.files.length) {
    alert("Please select or drop a CSV file first!");
    return;
  }

  if (isNaN(targetDay)) {
    alert("Please enter a valid day number!");
    return;
  }

  statusDiv.style.color = "var(--brand-beige)";
  statusDiv.textContent = "Processing CSV locally...";

  const file = fileInput.files[0];
  const reader = new FileReader();

  reader.onload = function(e) {
    try {
      const parsedData = parseCSV(e.target.result);
      const summaryArray = generateSummary(parsedData, targetDay);
      
      if (summaryArray) {
        statusDiv.style.color = "#22c55e";
        statusDiv.textContent = `✅ Successfully processed local data for Day ${targetDay}.`;
        renderTable(summaryArray);
      }
    } catch(err) {
      statusDiv.style.color = "#ef4444";
      statusDiv.textContent = "❌ Error processing CSV: " + err.message;
    }
  };

  reader.readAsText(file);
}

function generateSummary(rows, targetDay) {
  if (!rows || rows.length < 2) {
    alert("CSV file appears to be empty or missing data!");
    return null;
  }

  const headers = rows[0].map(h => cleanStr(h).toLowerCase());
  let assigneeIdx = headers.findIndex(h => h.includes('assignee') && !h.includes('updated'));
  let statusIdx = headers.findIndex(h => h.includes('status'));
  let dateIdx = headers.findIndex(h => h.includes('assignee updated') || h.includes('updated'));

  if (assigneeIdx === -1) assigneeIdx = 2;
  if (statusIdx === -1) statusIdx = 1;
  if (dateIdx === -1) dateIdx = 9;

  const stats = {};

  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.length <= Math.max(assigneeIdx, statusIdx, dateIdx)) continue;

    const assignee = cleanStr(row[assigneeIdx]);
    const status = cleanStr(row[statusIdx]);
    const updatedStr = cleanStr(row[dateIdx]);

    if (!assignee || assignee === '-' || assignee === "'-") continue;

    let rowDay = null;
    if (updatedStr) {
      const match = updatedStr.match(/-\d{2}-?(\d{2})/);
      if (match) rowDay = parseInt(match[1], 10);
    }
    if (rowDay !== targetDay) continue;

    if (!stats[assignee]) {
      stats[assignee] = { successful: 0, denied: 0, refunded: 0, coolOff: 0, escalated: 0, expired: 0 };
    }

    const lowerStatus = status.toLowerCase();
    if (lowerStatus === 'successful') stats[assignee].successful++;
    else if (lowerStatus === 'unsuccessful' || lowerStatus === 'denied') stats[assignee].denied++;
    else if (lowerStatus === 'already refunded') stats[assignee].refunded++;
    else if (lowerStatus === 'cool off') stats[assignee].coolOff++;
    else if (lowerStatus === 'escalated') stats[assignee].escalated++;
    else if (lowerStatus === 'expired') stats[assignee].expired++;
  }

  return Object.keys(stats).map(name => {
    const s = stats[name];
    const totalDispute = s.successful + s.denied + s.refunded + s.coolOff + s.escalated + s.expired;
    const winRateDenom = s.successful + s.denied + s.coolOff;
    const winRate = winRateDenom > 0 ? (s.successful / winRateDenom * 100).toFixed(2) : "0.00";
    return { name, ...s, totalDispute, winRate: parseFloat(winRate) };
  }).sort((a, b) => b.totalDispute - a.totalDispute);
}

function renderTable(data) {
  const outputDiv = document.getElementById('output');
  if (!data || data.length === 0) {
    outputDiv.innerHTML = `<p style="color:#ef4444; font-weight:bold; font-size: 11px;">No records found matching criteria.</p>`;
    return;
  }

  let totals = { succ: 0, den: 0, ref: 0, cool: 0, esc: 0, exp: 0, total: 0 };
  let html = `<table><thead><tr><th class="text-left">Assignee</th><th>Successful</th><th>Denied</th><th>Already Refunded</th><th>Cool Off</th><th>Escalated</th><th>Expired</th><th>Total Order Dispute</th><th>Win Rate</th></tr></thead><tbody>`;

  data.forEach(row => {
    totals.succ += row.successful; totals.den += row.denied; totals.ref += row.refunded;
    totals.cool += row.coolOff; totals.esc += row.escalated; totals.exp += row.expired;
    totals.total += row.totalDispute;

    html += `<tr><td class="text-left">${row.name}</td><td>${row.successful}</td><td>${row.denied}</td><td>${row.refunded}</td><td>${row.coolOff}</td><td>${row.escalated}</td><td>${row.expired}</td><td>${row.totalDispute}</td><td>${row.winRate.toFixed(2)}%</td></tr>`;
  });

  const overallWinRateDenom = totals.succ + totals.den + totals.cool;
  const overallWinRate = overallWinRateDenom > 0 ? (totals.succ / overallWinRateDenom * 100).toFixed(2) : "0.00";

  html += `<tr class="summary-row"><td class="text-left">Grand Total</td><td>${totals.succ}</td><td>${totals.den}</td><td>${totals.ref}</td><td>${totals.cool}</td><td>${totals.esc}</td><td>${totals.exp}</td><td>${totals.total}</td><td>${overallWinRate}%</td></tr></tbody></table>`;
  outputDiv.innerHTML = html;
}
</script>
</body>
</html>
