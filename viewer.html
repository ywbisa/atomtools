<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATOM Daily Tracker - TV Wallboard</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23121212'/><text x='50%' y='68%' font-family='sans-serif' font-weight='900' font-size='52' fill='%23D1C2A5'>DT</text></svg>">

  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: #141418;
      --border-color: #27272a;
      --brand-beige: #e2d4bc;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      /* Google Sheets Palette */
      --gs-header-bg: #4a6585;      /* Steel blue header */
      --gs-header-text: #ffffff;    /* Pure white header text */
      --gs-row-odd: #ffffff;        /* White row */
      --gs-row-even: #f3f3f3;       /* Light gray row */
      --gs-border: #d9d9d9;
      --gs-total-bg: #e0e0e0;
    }

    * { box-sizing: border-box; }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
      background-color: var(--bg-color); 
      color: var(--text-main);
      margin: 0;
      padding: 14px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* TOP TV STATUS BAR */
    .brand-header {
      width: 100%;
      max-width: 1920px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border-color);
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-title {
      font-weight: 900;
      font-size: 26px;
      letter-spacing: 2px;
      color: var(--brand-beige);
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      border-left: 2px solid #334155;
      padding-left: 12px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .page-indicator-badge {
      font-size: 13px;
      color: var(--brand-beige);
      background: #18181b;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .status-badge {
      font-size: 13px;
      color: #4ade80;
      background: #18181b;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* MAIN TV CARD CONTAINER */
    .card { 
      background: var(--card-bg); 
      padding: 16px 20px; 
      border-radius: 10px; 
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 1920px; 
      flex: 1;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .card-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }

    .card-title {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 24px;
      background-color: var(--brand-beige);
      border-radius: 2px;
    }

    .report-meta {
      font-size: 15px;
      color: var(--text-muted);
      font-weight: 600;
      background: #18181b;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    /* FULL WIDTH TABLE CONTAINER */
    .table-container {
      width: 100%;
      background-color: transparent;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    /* STANDARD FULL-WIDTH TABLE */
    table { 
      width: 100%; 
      table-layout: fixed;
      border-collapse: collapse;
      border-spacing: 0;
      background-color: transparent;
    }

    /* COLUMN WIDTH LOCKS (9 Columns totaling 100%) */
    .col-assignee { width: 22%; }
    .col-lob      { width: 10%; }
    .col-succ     { width: 9%; }
    .col-den      { width: 9%; }
    .col-ref      { width: 10%; }
    .col-cool     { width: 7%; }
    .col-exp      { width: 7%; }
    .col-total    { width: 13%; }
    .col-win      { width: 13%; }

    /* TABLE CELLS */
    th, td { 
      border-right: 1px solid var(--gs-border);
      border-bottom: 1px solid var(--gs-border);
      padding: 13px 10px; 
      text-align: center; 
      font-size: 21px;
      line-height: 1.25;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #000000;
    }

    th:last-child, td:last-child {
      border-right: none;
    }

    /* WHITE TEXT HEADERS ON STEEL BLUE */
    th { 
      background-color: var(--gs-header-bg); 
      color: var(--gs-header-text); 
      padding: 14px 8px; 
      font-weight: 800;
      font-size: 17px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      border-right: 1px solid #5d799b;
      border-bottom: none;
    }

    th.assignee-header {
      text-align: left;
      padding-left: 20px;
    }

    /* ALTERNATING WHITE & GRAY ROWS */
    tbody tr:nth-child(even) td { 
      background-color: var(--gs-row-even); 
    }
    
    tbody tr:nth-child(odd) td { 
      background-color: var(--gs-row-odd); 
    }

    .text-left { 
      text-align: left; 
      font-weight: 700; 
      color: #000000;
      padding-left: 20px;
    }

    .lob-cell {
      font-weight: 700;
      color: #000000;
      text-align: center;
    }

    .metric-num {
      font-weight: 500;
      color: #000000;
    }

    .total-disputed-cell {
      font-weight: 800;
      color: #000000;
    }

    .winrate-cell {
      font-weight: 800;
      color: #000000;
    }

    /* PINNED GRAND TOTAL FOOTER */
    tfoot tr td { 
      font-weight: 900; 
      background-color: var(--gs-total-bg) !important; 
      color: #000000;
      border-top: 2px solid #000000;
      border-bottom: none;
      padding: 14px 10px;
      font-size: 22px;
    }

    tfoot tr td.text-left {
      color: #000000;
      font-size: 22px;
    }

    .fade-switch {
      animation: fadeInRow 0.35s ease-in-out;
    }

    @keyframes fadeInRow {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .empty-state {
      padding: 80px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 20px;
      font-weight: 600;
      background: #18181b;
      border-radius: 4px;
    }

    .brand-footer {
      margin-top: 10px;
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- TOP TV STATUS BAR -->
  <div class="brand-header">
    <div class="brand-left">
      <div class="brand-title">ATOMS Daily Tracker</div>
      <div class="brand-subtitle">Operations Live Board</div>
    </div>
    <div class="header-right">
      <div class="page-indicator-badge" id="pageIndicator">Live Feed Active</div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span id="badgeText">Live Feed Active</span>
      </div>
    </div>
  </div>

  <!-- MAIN CARD CONTAINER -->
  <div class="card">
    <div class="card-top-bar">
      <div>
        <div class="card-title" id="reportTitle">Daily Ticket Summary</div>
      </div>
      <div class="report-meta" id="reportMeta">Connecting live stream...</div>
    </div>

    <div class="table-container" id="output">
      <div class="empty-state">Waiting for report upload from Admin...</div>
    </div>
  </div>

  <div class="brand-footer">
    ATOMS Operations • Real-Time Operations Display © 2026
  </div>

<script>
const SYNC_TOPIC = "ywbisa_tracker_live_sync";
let lastChecksum = "";

// TV ROTATION SETTINGS
const ROWS_PER_PAGE = 13;      
const ROTATION_INTERVAL = 4000; 
let currentPage = 0;
let cachedRows = [];
let cachedTotals = null;
let rotationTimer = null;

// ==========================================
// AGENT LOB DIRECTORY (1PD/3PD, 3PD, Live Remake)
// ==========================================
const LOB_DIRECTORY = {
  // 1PD/3PD AGENTS
  "miguelangelogeolina": "1PD/3PD", "miguelgeolina": "1PD/3PD",
  "lloydpropia": "1PD/3PD",

  // 3PD AGENTS
  "jenschelleeslais": "3PD",
  "aljelleedamalerio": "3PD", "aljeldamalerio": "3PD",
  "irenedonizazyramaesimbajon": "3PD", "irenesimbajon": "3PD",
  "kiffedominicbelenson": "3PD", "kiffebelenson": "3PD",
  "jeussanejoydemoral": "3PD", "jeussanedemoral": "3PD",
  "gabriellelouiseabajero": "3PD", "gabrielleabajero": "3PD",
  "jenielpearlople": "3PD", "jenielople": "3PD",
  "mariajaninecamlahsale": "3PD", "mariasale": "3PD",
  "danielajanesulelom": "3PD",
  "jasmineceballos": "3PD",
  "daisyberonilla": "3PD",
  "johasmaxuelcamello": "3PD", "johascamello": "3PD",
  "shairacastillo": "3PD",
  "genevevbantilan": "3PD",
  "russeljannguho": "3PD",
  "renzelkennbuenos": "3PD",
  "haroldmakiling": "3PD",
  "laurencejamesquistadio": "3PD",
  "christianralphantatico": "3PD", "christianantatico": "3PD",
  "johnkennethturugan": "3PD",
  "ausiedelima": "3PD",
  "janevicalolor": "3PD",
  "marymaymusa": "3PD",
  "ericagoloran": "3PD",
  "hannahmautad": "3PD",
  "jamaicarosales": "3PD",
  "rheamaebuscano": "3PD",
  "shemuzzieljustiniani": "3PD", "shemjustiniani": "3PD",
  "honeyclairetanutan": "3PD",

  // LIVE REMAKE AGENTS
  "saimorpanganiban": "Live Remake",
  "melvindejesus": "Live Remake",
  "chairamaewata": "Live Remake", "chairawata": "Live Remake",
  "donnacristobal": "Live Remake",
  "sitihariyadiquituar": "Live Remake", "sitiquituar": "Live Remake",
  "eronjoshuacasuyac": "Live Remake", "eroncasuyac": "Live Remake",
  "hazelelaineversuela": "Live Remake", "hazelversuela": "Live Remake",
  "jovirdomingo": "Live Remake",
  "kateashleymaglasang": "Live Remake", "katemaglasang": "Live Remake",
  "markpetersenycong": "Live Remake", "markycong": "Live Remake",
  "jevelynjamero": "Live Remake",
  "jenamiesagetarios": "Live Remake"
};

function getAgentLOB(name) {
  if (!name) return "-";
  const clean = name.toLowerCase().replace(/[^a-z0-9]/g, '');
  if (LOB_DIRECTORY[clean]) return LOB_DIRECTORY[clean];

  // Fallback: Check first and last name combination
  const parts = name.trim().split(/\s+/);
  if (parts.length >= 2) {
    const fl = (parts[0] + parts[parts.length - 1]).toLowerCase().replace(/[^a-z0-9]/g, '');
    if (LOB_DIRECTORY[fl]) return LOB_DIRECTORY[fl];

    const first = parts[0].toLowerCase().replace(/[^a-z0-9]/g, '');
    const last = parts[parts.length - 1].toLowerCase().replace(/[^a-z0-9]/g, '');
    for (const key in LOB_DIRECTORY) {
      if (key.includes(first) && key.includes(last)) {
        return LOB_DIRECTORY[key];
      }
    }
  }

  return "-";
}

// ==========================================
// DUAL-CHANNEL AUTO-UPDATE ENGINE
// ==========================================

// Channel 1: High-Speed Local Storage Watcher (Auto-updates in <1s on same computer without refresh)
function checkLocalCache() {
  try {
    const localCached = localStorage.getItem('atom_tracker_live_data');
    if (localCached) {
      renderReport(JSON.parse(localCached));
    }
  } catch(e) {}
}

// Channel 2: Cloud Relay Poller (Auto-updates TV wallboard over Wi-Fi without refresh)
const CLOUD_SERVERS = [
  `https://ntfy.sh/${SYNC_TOPIC}/json?poll=1&since=24h`,
  `https://push.ox2.fr/${SYNC_TOPIC}/json?poll=1&since=24h`
];
let currentServerIdx = 0;

function pollCloudData() {
  const url = CLOUD_SERVERS[currentServerIdx] + `&_t=${Date.now()}`;

  if (typeof fetch === 'function') {
    fetch(url)
      .then(res => {
        if (!res.ok) throw new Error("Status " + res.status);
        return res.text();
      })
      .then(text => {
        if (text && text.trim()) {
          processResponse(text);
        }
      })
      .catch(() => tryXHR(url));
  } else {
    tryXHR(url);
  }
}

function tryXHR(url) {
  try {
    const xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.timeout = 3000;
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4) {
        if (xhr.status === 200 && xhr.responseText && xhr.responseText.trim()) {
          processResponse(xhr.responseText);
        } else if (xhr.status !== 200) {
          currentServerIdx = (currentServerIdx + 1) % CLOUD_SERVERS.length;
        }
      }
    };
    xhr.ontimeout = function() {
      currentServerIdx = (currentServerIdx + 1) % CLOUD_SERVERS.length;
    };
    xhr.send();
  } catch(e) {}
}

function processResponse(rawText) {
  if (!rawText || !rawText.trim()) return;

  const lines = rawText.trim().split('\n');
  for (let i = lines.length - 1; i >= 0; i--) {
    try {
      const line = lines[i].trim();
      if (!line) continue;
      const item = JSON.parse(line);
      if (item.event === 'message' && item.message) {
        const payload = (typeof item.message === 'string') ? JSON.parse(item.message) : item.message;
        renderReport(payload);
        break;
      }
    } catch(e) {}
  }
}

function renderReport(payload) {
  if (!payload) return;

  if (typeof payload === 'string') {
    try { payload = JSON.parse(payload); } catch(e) {}
  }

  // Detect if new broadcast has arrived
  const currentChecksum = JSON.stringify(payload);
  const tableExists = document.getElementById('summaryTable') !== null;
  if (tableExists && currentChecksum === lastChecksum) return; 
  lastChecksum = currentChecksum;

  const meta = document.getElementById('reportMeta');
  const title = document.getElementById('reportTitle');

  if (payload.day && title) {
    title.textContent = `Daily Ticket Summary — Day ${payload.day} (PHT)`;
  }
  if (meta) {
    meta.textContent = payload.updatedAt ? `Last Broadcast: ${payload.updatedAt}` : 'Live Report Active';
  }

  // Universal Unpacking
  let rows = [];
  if (Array.isArray(payload)) {
    rows = payload;
  } else if (Array.isArray(payload.rows)) {
    rows = payload.rows;
  } else if (Array.isArray(payload.data)) {
    rows = payload.data;
  } else if (Array.isArray(payload.r)) {
    rows = payload.r.map(row => ({
      name: row[0],
      successful: row[1],
      denied: row[2],
      refunded: row[3],
      coolOff: row[4],
      escalated: row[5],
      expired: row[6],
      totalDispute: row[7],
      winRate: row[8]
    }));
  }

  renderTable(rows);
}

function renderTable(data) {
  const outputDiv = document.getElementById('output');
  if (!outputDiv) return;

  if (!data || !Array.isArray(data) || data.length === 0) {
    outputDiv.innerHTML = `<div class="empty-state">No matching rows found in this report.</div>`;
    const indicator = document.getElementById('pageIndicator');
    if (indicator) indicator.textContent = '0 Agents';
    return;
  }

  let totals = { succ: 0, den: 0, ref: 0, cool: 0, esc: 0, exp: 0, total: 0 };
  data.forEach(row => {
    if (!row) return;
    const s = Number(row.successful) || 0;
    const d = Number(row.denied) || 0;
    const r = Number(row.refunded) || 0;
    const c = Number(row.coolOff) || 0;
    const e = Number(row.escalated) || 0;
    const x = Number(row.expired) || 0;
    const t = (row.totalDispute !== undefined && !isNaN(Number(row.totalDispute))) 
              ? Number(row.totalDispute) 
              : (s + d + r + c + e);

    totals.succ += s;
    totals.den += d;
    totals.ref += r;
    totals.cool += c;
    totals.esc += e;
    totals.exp += x;
    totals.total += t;
  });

  const overallWinRateDenom = totals.succ + totals.den + totals.cool;
  totals.overallWinRate = overallWinRateDenom > 0 ? (totals.succ / overallWinRateDenom * 100).toFixed(2) : "0.00";

  cachedRows = data;
  cachedTotals = totals;
  currentPage = 0;

  buildTableShell();
  renderCurrentPage();

  if (rotationTimer) clearInterval(rotationTimer);
  if (cachedRows.length > ROWS_PER_PAGE) {
    rotationTimer = setInterval(nextPage, ROTATION_INTERVAL);
  }
}

function buildTableShell() {
  const outputDiv = document.getElementById('output');
  if (!outputDiv || !cachedRows || cachedRows.length === 0) return;

  // LOB placed to the left of Successful, Escalated removed
  outputDiv.innerHTML = `
    <table id="summaryTable">
      <colgroup>
        <col class="col-assignee">
        <col class="col-lob">
        <col class="col-succ">
        <col class="col-den">
        <col class="col-ref">
        <col class="col-cool">
        <col class="col-exp">
        <col class="col-total">
        <col class="col-win">
      </colgroup>
      <thead>
        <tr>
          <th class="assignee-header">Assignee</th>
          <th>LOB</th>
          <th>Successful</th>
          <th>Denied</th>
          <th>Already Refunded</th>
          <th>Cool Off</th>
          <th>Expired</th>
          <th>Total Disputed</th>
          <th>Winrate</th>
        </tr>
      </thead>
      <tbody id="pagedTbody">
        <!-- Dynamic Paged Rows -->
      </tbody>
      <tfoot>
        <tr class="summary-row">
          <td class="text-left" colspan="2">Grand Total</td>
          <td class="metric-num">${cachedTotals.succ}</td>
          <td class="metric-num">${cachedTotals.den}</td>
          <td class="metric-num">${cachedTotals.ref}</td>
          <td class="metric-num">${cachedTotals.cool}</td>
          <td class="metric-num">${cachedTotals.exp}</td>
          <td class="total-disputed-cell">${cachedTotals.total}</td>
          <td class="winrate-cell">${cachedTotals.overallWinRate}%</td>
        </tr>
      </tfoot>
    </table>
  `;
}

function renderCurrentPage() {
  const tbody = document.getElementById('pagedTbody');
  const indicator = document.getElementById('pageIndicator');
  if (!tbody || !cachedRows || cachedRows.length === 0) return;

  const totalPages = Math.ceil(cachedRows.length / ROWS_PER_PAGE) || 1;
  if (indicator) {
    indicator.textContent = `Page ${currentPage + 1} of ${totalPages} • ${cachedRows.length} Agents`;
  }

  const start = currentPage * ROWS_PER_PAGE;
  const end = start + ROWS_PER_PAGE;
  const pageSlice = cachedRows.slice(start, end);

  let rowsHtml = '';
  pageSlice.forEach(row => {
    if (!row) return;
    const s = Number(row.successful) || 0;
    const d = Number(row.denied) || 0;
    const r = Number(row.refunded) || 0;
    const c = Number(row.coolOff) || 0;
    const x = Number(row.expired) || 0;
    const e = Number(row.escalated) || 0;
    const t = (row.totalDispute !== undefined && !isNaN(Number(row.totalDispute))) 
              ? Number(row.totalDispute) 
              : (s + d + r + c + e);
    const w = typeof row.winRate === 'number' ? row.winRate.toFixed(2) : parseFloat(row.winRate || 0).toFixed(2);
    const agentLob = getAgentLOB(row.name);

    rowsHtml += `
      <tr class="fade-switch">
        <td class="text-left">${row.name || ''}</td>
        <td class="lob-cell">${agentLob}</td>
        <td class="metric-num">${s}</td>
        <td class="metric-num">${d}</td>
        <td class="metric-num">${r}</td>
        <td class="metric-num">${c}</td>
        <td class="metric-num">${x}</td>
        <td class="total-disputed-cell">${t}</td>
        <td class="winrate-cell">${w}%</td>
      </tr>
    `;
  });

  tbody.innerHTML = rowsHtml;
}

function nextPage() {
  if (!cachedRows || cachedRows.length <= ROWS_PER_PAGE) return;
  const totalPages = Math.ceil(cachedRows.length / ROWS_PER_PAGE);
  currentPage = (currentPage + 1) % totalPages;
  renderCurrentPage();
}

// 1. Check local storage immediately on startup
checkLocalCache();

// 2. Poll local storage every 1 second (Auto-updates without refreshing when admin broadcasts)
setInterval(checkLocalCache, 1000);

// 3. Poll cloud relay every 3.5 seconds (Auto-updates TV wallboard over Wi-Fi without refreshing)
pollCloudData();
setInterval(pollCloudData, 3500);

// 4. Same-browser instant event listeners
window.addEventListener('storage', (e) => {
  if (e.key === 'atom_tracker_live_data' && e.newValue) {
    try { renderReport(JSON.parse(e.newValue)); } catch(err) {}
  }
});

try {
  new BroadcastChannel('atom_tracker_live_channel').onmessage = (e) => {
    if (e.data) renderReport(e.data);
  };
} catch(e) {}

window.addEventListener('message', (e) => {
  if (e.data) {
    if (e.data.atom_tracker_live_data) renderReport(e.data.atom_tracker_live_data);
