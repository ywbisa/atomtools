<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATOM Daily Tracker - Smart TV Display</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23121212'/><text x='50%' y='68%' font-family='sans-serif' font-weight='900' font-size='52' fill='%23D1C2A5'>DT</text></svg>">

  <style>
    :root {
      --bg-color: #080808;
      --card-bg: #0d0d0d;
      --border-color: #222222;
      --brand-beige: #D1C2A5;
      --text-main: #EEEEEE;
      --text-muted: #888888;
      --gs-header-assignee-bg: #dbe5f1;
      --gs-header-metrics-bg: #7b92b3;
      --gs-header-text: #ffffff;
      --gs-row-even: #f3f3f3;
      --gs-row-odd: #ffffff;
      --gs-border: #d9d9d9;
      --gs-text: #000000;
      --gs-total-bg: #e0e0e0;
    }

    * { box-sizing: border-box; }

    body { 
      font-family: Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background-color: var(--bg-color); 
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 15px;
    }

    .brand-header {
      width: 100%;
      max-width: 1400px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-title {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 1.5px;
      color: var(--brand-beige);
      text-transform: uppercase;
    }

    .status-badge {
      font-size: 11px;
      color: #22c55e;
      background: #141414;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 6px #22c55e;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    .card { 
      background: var(--card-bg); 
      padding: 16px; 
      border-radius: 6px; 
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 1400px; 
      margin-bottom: 12px;
    }

    .card-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-title::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: var(--brand-beige);
      border-radius: 1px;
    }

    .report-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      background-color: #ffffff;
    }

    table { 
      width: 100%; 
      border-collapse: separate; 
      border-spacing: 0;
      background-color: #ffffff;
      border-top: 1px solid var(--gs-border);
      border-left: 1px solid var(--gs-border);
      font-family: Arial, sans-serif;
    }

    th, td { 
      border-right: 1px solid var(--gs-border);
      border-bottom: 1px solid var(--gs-border);
      padding: 6px 10px; 
      text-align: center !important; 
      font-size: 14px;
      line-height: 1.3;
      color: var(--gs-text);
      font-variant-numeric: tabular-nums;
    }

    th { 
      background-color: var(--gs-header-metrics-bg) !important; 
      color: var(--gs-header-text) !important; 
      padding: 8px 10px; 
      font-weight: normal !important;
      font-size: 14px;
    }

    th.assignee-header {
      background-color: var(--gs-header-assignee-bg) !important;
      color: #000000 !important;
      font-style: italic;
      text-align: left !important;
    }

    tr:nth-child(even) td { background-color: var(--gs-row-even); }
    tr:nth-child(odd) td { background-color: var(--gs-row-odd); }

    .text-left { 
      text-align: left !important; 
      font-weight: normal !important; 
      color: #000000 !important;
    }

    .summary-row td { 
      font-weight: 700 !important; 
      background-color: var(--gs-total-bg) !important; 
      color: #000000 !important;
      border-top: 2px solid #000000 !important;
      border-bottom: 2px solid #000000 !important;
      padding: 7px 10px;
    }

    .summary-row td.text-left {
      text-align: left !important;
    }

    .empty-state {
      padding: 30px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      background: #141414;
      border-radius: 4px;
    }

    .brand-footer {
      margin-top: 16px;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="brand-header">
    <div class="brand-title">ATOMS Daily Tracker</div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="badgeText">Live Receiver Ready</span>
    </div>
  </div>

  <div class="card">
    <div class="card-top-bar">
      <div>
        <div class="card-title" id="reportTitle">Daily Ticket Summary</div>
        <div class="report-meta" id="reportMeta">Connecting live stream...</div>
      </div>
    </div>

    <div class="table-container" id="output">
      <div class="empty-state">Waiting for report upload from Admin...</div>
    </div>
  </div>

  <div class="brand-footer">
    ATOMS Operations &copy; 2026
  </div>

<script>
const SYNC_TOPIC = "ywbisa_atomtools_sync";
let lastChecksum = "";
let ws = null;

// 1. PRIMARY: DIRECT WEBSOCKET CONNECTION (Instant push, no CORS, no caching)
function connectWebSocket() {
  try {
    ws = new WebSocket(`wss://ntfy.sh/${SYNC_TOPIC}/ws?since=24h`);

    ws.onopen = () => {
      document.getElementById('reportMeta').textContent = "Live Stream Connected — Listening for updates";
    };

    ws.onmessage = (event) => {
      handleIncomingData(event.data);
    };

    ws.onclose = () => {
      setTimeout(connectWebSocket, 4000);
    };

    ws.onerror = () => {
      try { ws.close(); } catch(e) {}
    };
  } catch(e) {
    console.warn("WebSocket not supported, relying on clean HTTP fallback.");
  }
}

// 2. BACKUP: CLEAN HTTP GET (No custom headers to avoid TV CORS preflight blocks)
async function fetchFallbackCheck() {
  try {
    const res = await fetch(`https://ntfy.sh/${SYNC_TOPIC}/json?poll=1&since=24h`);
    if (!res.ok) return;

    const rawText = await res.text();
    if (!rawText.trim()) return;

    const lines = rawText.trim().split('\n');
    for (let i = lines.length - 1; i >= 0; i--) {
      try {
        const item = JSON.parse(lines[i]);
        if (item.event === 'message') {
          handleIncomingData(item);
          break;
        }
      } catch(e) {}
    }
  } catch(err) {
    // Ignore minor network hiccups quietly
  }
}

// UNIFIED MESSAGE PROCESSOR
function handleIncomingData(raw) {
  try {
    let payload = raw;
    if (typeof payload === 'string') {
      payload = JSON.parse(payload);
    }
    // Unwrap from ntfy envelope
    if (payload && payload.event === 'message' && payload.message) {
      payload = typeof payload.message === 'string' ? JSON.parse(payload.message) : payload.message;
    }

    if (payload && (payload.rows || payload.r)) {
      renderReportFromPayload(payload);
    }
  } catch(err) {
    console.error("Payload parse error:", err);
  }
}

function renderReportFromPayload(payload) {
  const currentChecksum = JSON.stringify(payload);
  if (currentChecksum === lastChecksum) return; 
  lastChecksum = currentChecksum;

  const meta = document.getElementById('reportMeta');
  const title = document.getElementById('reportTitle');

  if (payload.day) {
    title.textContent = `Daily Ticket Summary — Day ${payload.day} (PHT)`;
  }
  meta.textContent = payload.updatedAt ? `Last Live Broadcast: ${payload.updatedAt}` : 'Live Report Active';

  let rows = [];
  if (Array.isArray(payload.rows)) {
    rows = payload.rows;
  } else if (Array.isArray(payload.r)) {
    rows = payload.r.map(row => ({
      name: row[0],
      successful: row[1],
      denied: row[2],
      refunded: row[3],
      coolOff: row[4],
      escalated: row[5],
      expired: row[6],
      totalDispute: row[7],
      winRate: row[8]
    }));
  }

  renderTable(rows);
}

function renderTable(data) {
  const outputDiv = document.getElementById('output');
  if (!data || data.length === 0) {
    outputDiv.innerHTML = `<div class="empty-state">No matching rows found in this report.</div>`;
    return;
  }

  let totals = { succ: 0, den: 0, ref: 0, cool: 0, esc: 0, exp: 0, total: 0 };
  let html = `<table id="summaryTable"><thead><tr><th class="assignee-header">Assignee</th><th>Successful</th><th>Denied</th><th>Already Refunded</th><th>Cool Off</th><th>Escalated</th><th>Expired</th><th>Total Order Disputed</th><th>Winrate</th></tr></thead><tbody>`;

  data.forEach(row => {
    const s = Number(row.successful) || 0;
    const d = Number(row.denied) || 0;
    const r = Number(row.refunded) || 0;
    const c = Number(row.coolOff) || 0;
    const e = Number(row.escalated) || 0;
    const x = Number(row.expired) || 0;
    const t = Number(row.totalDispute) || (s + d + r + c + e + x);
    const w = typeof row.winRate === 'number' ? row.winRate.toFixed(2) : parseFloat(row.winRate || 0).toFixed(2);

    totals.succ += s;
    totals.den += d;
    totals.ref += r;
    totals.cool += c;
    totals.esc += e;
    totals.exp += x;
    totals.total += t;

    html += `<tr><td class="text-left">${row.name}</td><td>${s}</td><td>${d}</td><td>${r}</td><td>${c}</td><td>${e}</td><td>${x}</td><td>${t}</td><td>${w}%</td></tr>`;
  });

  const overallWinRateDenom = totals.succ + totals.den + totals.cool;
  const overallWinRate = overallWinRateDenom > 0 ? (totals.succ / overallWinRateDenom * 100).toFixed(2) : "0.00";

  html += `<tr class="summary-row"><td class="text-left">Grand Total</td><td>${totals.succ}</td><td>${totals.den}</td><td>${totals.ref}</td><td>${totals.cool}</td><td>${totals.esc}</td><td>${totals.exp}</td><td>${totals.total}</td><td>${overallWinRate}%</td></tr></tbody></table>`;
  outputDiv.innerHTML = html;
}

// Start WebSocket connection for instant push
connectWebSocket();

// Run immediate fallback HTTP check + poll every 5s gently
fetchFallbackCheck();
setInterval(fetchFallbackCheck, 5000);

// Local browser sync for testing tabs on the same computer
window.addEventListener('storage', (e) => {
  if (e.key === 'atom_tracker_live_data' && e.newValue) {
    try { handleIncomingData(JSON.parse(e.newValue)); } catch(err) {}
  }
});
try {
  new BroadcastChannel('atom_tracker_live_channel').onmessage = (e) => {
    if (e.data) handleIncomingData(e.data);
  };
} catch(e) {}
</script>
</body>
</html>
