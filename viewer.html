<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATOM Daily Tracker - Smart TV Display</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23121212'/><text x='50%' y='68%' font-family='sans-serif' font-weight='900' font-size='52' fill='%23D1C2A5'>DT</text></svg>">

  <style>
    :root {
      --bg-color: #080808;
      --card-bg: #0d0d0d;
      --border-color: #222222;
      --brand-beige: #D1C2A5;
      --text-main: #EEEEEE;
      --text-muted: #888888;
      --gs-header-assignee-bg: #dbe5f1;
      --gs-header-metrics-bg: #7b92b3;
      --gs-header-text: #ffffff;
      --gs-row-even: #f3f3f3;
      --gs-row-odd: #ffffff;
      --gs-border: #d9d9d9;
      --gs-text: #000000;
      --gs-total-bg: #e0e0e0;
    }

    * { box-sizing: border-box; }

    body { 
      font-family: Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background-color: var(--bg-color); 
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 15px;
    }

    .brand-header {
      width: 100%;
      max-width: 1400px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-title {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 1.5px;
      color: var(--brand-beige);
      text-transform: uppercase;
    }

    .status-badge {
      font-size: 11px;
      color: #22c55e;
      background: #141414;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 6px #22c55e;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    .card { 
      background: var(--card-bg); 
      padding: 16px; 
      border-radius: 6px; 
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 1400px; 
      margin-bottom: 12px;
    }

    .card-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-title::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: var(--brand-beige);
      border-radius: 1px;
    }

    .report-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      background-color: #ffffff;
    }

    table { 
      width: 100%; 
      border-collapse: separate; 
      border-spacing: 0;
      background-color: #ffffff;
      border-top: 1px solid var(--gs-border);
      border-left: 1px solid var(--gs-border);
      font-family: Arial, sans-serif;
    }

    th, td { 
      border-right: 1px solid var(--gs-border);
      border-bottom: 1px solid var(--gs-border);
      padding: 6px 10px; 
      text-align: center !important; 
      font-size: 14px;
      line-height: 1.3;
      color: var(--gs-text);
      font-variant-numeric: tabular-nums;
    }

    th { 
      background-color: var(--gs-header-metrics-bg) !important; 
      color: var(--gs-header-text) !important; 
      padding: 8px 10px; 
      font-weight: normal !important;
      font-size: 14px;
    }

    th.assignee-header {
      background-color: var(--gs-header-assignee-bg) !important;
      color: #000000 !important;
      font-style: italic;
      text-align: left !important;
    }

    tr:nth-child(even) td { background-color: var(--gs-row-even); }
    tr:nth-child(odd) td { background-color: var(--gs-row-odd); }

    .text-left { 
      text-align: left !important; 
      font-weight: normal !important; 
      color: #000000 !important;
    }

    .summary-row td { 
      font-weight: 700 !important; 
      background-color: var(--gs-total-bg) !important; 
      color: #000000 !important;
      border-top: 2px solid #000000 !important;
      border-bottom: 2px solid #000000 !important;
      padding: 7px 10px;
    }

    .summary-row td.text-left {
      font-weight: 700 !important;
      text-align: left !important;
    }

    .empty-state {
      padding: 30px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      background: #141414;
      border-radius: 4px;
    }

    .brand-footer {
      margin-top: 16px;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="brand-header">
    <div class="brand-title">ATOMS Daily Tracker</div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="badgeText">Cloud Connected</span>
    </div>
  </div>

  <div class="card">
    <div class="card-top-bar">
      <div class="card-title" id="reportTitle">Daily Ticket Summary</div>
      <div class="report-meta" id="reportMeta">Connecting to cloud service...</div>
    </div>

    <div class="table-container" id="output">
      <div class="empty-state">Waiting for report upload from Admin...</div>
    </div>
  </div>

  <div class="brand-footer">
    ATOMS Operations &copy; 2026
  </div>

<script>
// ========================================================
// 1. SET YOUR FIREBASE DATABASE URL HERE
// ========================================================
const FIREBASE_DB_URL = "https://your-project-default-rtdb.firebaseio.com"; 
// Example: "https://atom-tracker-default-rtdb.firebaseio.com"

const urlParams = new URLSearchParams(window.location.search);
const firebaseUrl = (FIREBASE_DB_URL || urlParams.get('db') || localStorage.getItem('atom_firebase_url') || "").replace(/\/\$/, "");

let lastRenderedChecksum = "";

async function fetchCloudData() {
  if (!firebaseUrl || firebaseUrl.includes("your-project-default-rtdb")) {
    document.getElementById('reportMeta').textContent = "⚠️ Missing Firebase URL in viewer.html script!";
    return;
  }

  try {
    const res = await fetch(`${firebaseUrl}/tracker.json?_ts=${Date.now()}`, { cache: "no-store" });
    if (res.ok) {
      const payload = await res.json();
      if (payload && payload.rows) {
        displayReport(payload);
      }
    }
  } catch (err) {
    console.warn("Polling retry...", err);
  }
}

function displayReport(payload) {
  const currentChecksum = JSON.stringify(payload);
  if (currentChecksum === lastRenderedChecksum) return;
  lastRenderedChecksum = currentChecksum;

  const meta = document.getElementById('reportMeta');
  const title = document.getElementById('reportTitle');

  if (payload.day) {
    title.textContent = `Daily Ticket Summary — Day ${payload.day} (PHT)`;
  }
  meta.textContent = payload.updatedAt ? `Last Synced: ${payload.updatedAt}` : 'Live Report Active';

  renderTable(payload.rows);
}

function renderTable(data) {
  const outputDiv = document.getElementById('output');
  if (!data || data.length === 0) {
    outputDiv.innerHTML = `<div class="empty-state">No matching rows found in this report.</div>`;
    return;
  }

  let totals = { succ: 0, den: 0, ref: 0, cool: 0, esc: 0, exp: 0, total: 0 };
  let html = `<table id="summaryTable"><thead><tr><th class="assignee-header">Assignee</th><th>Successful</th><th>Denied</th><th>Already Refunded</th><th>Cool Off</th><th>Escalated</th><th>Expired</th><th>Total Order Disputed</th><th>Winrate</th></tr></thead><tbody>`;

  data.forEach(row => {
    totals.succ += row.successful; totals.den += row.denied; totals.ref += row.refunded;
    totals.cool += row.coolOff; totals.esc += row.escalated; totals.exp += row.expired;
    totals.total += row.totalDispute;

    html += `<tr><td class="text-left">${row.name}</td><td>${row.successful}</td><td>${row.denied}</td><td>${row.refunded}</td><td>${row.coolOff}</td><td>${row.escalated}</td><td>${row.expired}</td><td>${row.totalDispute}</td><td>${row.winRate.toFixed(2)}%</td></tr>`;
  });

  const overallWinRateDenom = totals.succ + totals.den + totals.cool;
  const overallWinRate = overallWinRateDenom > 0 ? (totals.succ / overallWinRateDenom * 100).toFixed(2) : "0.00";

  html += `<tr class="summary-row"><td class="text-left">Grand Total</td><td>${totals.succ}</td><td>${totals.den}</td><td>${totals.ref}</td><td>${totals.cool}</td><td>${totals.esc}</td><td>${totals.exp}</td><td>${totals.total}</td><td>${overallWinRate}%</td></tr></tbody></table>`;
  outputDiv.innerHTML = html;
}

// Initial fetch on page load
fetchCloudData();

// Poll Firebase every 3 seconds for automated real-time updates
setInterval(fetchCloudData, 3000);

// Local cross-tab backup listener
window.addEventListener('storage', (e) => {
  if (e.key === 'atom_tracker_live_data' && e.newValue) {
    try { displayReport(JSON.parse(e.newValue)); } catch(err) {}
  }
});
try {
  new BroadcastChannel('atom_tracker_live_channel').onmessage = (e) => {
    if (e.data) displayReport(e.data);
  };
} catch(e) {}
</script>
</body>
</html>
