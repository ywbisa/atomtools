<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATOM Daily Tracker - Report Viewer</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23121212'/><text x='50%' y='68%' font-family='sans-serif' font-weight='900' font-size='52' fill='%23D1C2A5'>DT</text></svg>">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --bg-color: #080808;
      --card-bg: #0d0d0d;
      --border-color: #222222;
      --brand-beige: #D1C2A5;
      --text-main: #EEEEEE;
      --text-muted: #888888;
      --gs-header-assignee-bg: #dbe5f1;
      --gs-header-metrics-bg: #7b92b3;
      --gs-header-text: #ffffff;
      --gs-row-even: #f3f3f3;
      --gs-row-odd: #ffffff;
      --gs-border: #d9d9d9;
      --gs-text: #000000;
      --gs-total-bg: #e0e0e0;
    }

    * { box-sizing: border-box; }

    body { 
      font-family: Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background-color: var(--bg-color); 
      color: var(--text-main);
      margin: 0;
      padding: 10px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 14px;
    }

    .brand-header {
      width: 100%;
      max-width: 1200px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-title {
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 1.5px;
      color: var(--brand-beige);
      text-transform: uppercase;
    }

    .status-badge {
      font-size: 10px;
      color: #22c55e;
      background: #141414;
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 4px #22c55e;
    }

    .card { 
      background: var(--card-bg); 
      padding: 12px; 
      border-radius: 6px; 
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 1200px; 
      margin-bottom: 12px;
    }

    .card-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .card-title {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-title::before {
      content: '';
      display: inline-block;
      width: 5px;
      height: 5px;
      background-color: var(--brand-beige);
      border-radius: 1px;
    }

    .report-meta {
      font-size: 11px;
      color: var(--text-muted);
    }

    button { 
      background-color: #0284c7; 
      color: #ffffff; 
      border: none; 
      padding: 0 14px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-weight: 700; 
      font-size: 11px; 
      height: 30px;
      transition: opacity 0.2s ease;
    }

    button:hover { opacity: 0.85; }

    .table-container {
      width: 100%;
      overflow-x: auto;
      background-color: #ffffff;
    }

    table { 
      width: 100%; 
      border-collapse: separate; 
      border-spacing: 0;
      background-color: #ffffff;
      border-top: 1px solid var(--gs-border);
      border-left: 1px solid var(--gs-border);
      font-family: Arial, sans-serif;
    }

    th, td { 
      border-right: 1px solid var(--gs-border);
      border-bottom: 1px solid var(--gs-border);
      padding: 4px 8px; 
      text-align: center !important; 
      font-size: 13px;
      line-height: 1.25;
      color: var(--gs-text);
      font-variant-numeric: tabular-nums;
    }

    th { 
      background-color: var(--gs-header-metrics-bg) !important; 
      color: var(--gs-header-text) !important; 
      padding: 6px 8px; 
      font-weight: normal !important;
      font-size: 13px;
    }

    th.assignee-header {
      background-color: var(--gs-header-assignee-bg) !important;
      color: #000000 !important;
      font-style: italic;
      text-align: left !important;
      font-weight: normal !important;
    }

    tr:nth-child(even) td { background-color: var(--gs-row-even); }
    tr:nth-child(odd) td { background-color: var(--gs-row-odd); }
    tr:hover td { background-color: #e8f0fe; }

    .text-left { 
      text-align: left !important; 
      font-weight: normal !important; 
      color: #000000 !important;
    }

    .summary-row td { 
      font-weight: 700 !important; 
      background-color: var(--gs-total-bg) !important; 
      color: #000000 !important;
      border-top: 2px solid #000000 !important;
      border-bottom: 2px solid #000000 !important;
      padding: 5px 8px;
      text-align: center !important;
    }

    .summary-row td.text-left {
      font-weight: 700 !important;
      text-align: left !important;
    }

    .empty-state {
      padding: 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      background: #141414;
      border-radius: 4px;
    }

    .brand-footer {
      margin-top: 16px;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="brand-header">
    <div class="brand-title">ATOMS Daily Tracker</div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="badgeText">Live Viewer</span>
    </div>
  </div>

  <div class="card">
    <div class="card-top-bar">
      <div>
        <div class="card-title" id="reportTitle">Daily Ticket Summary</div>
        <div class="report-meta" id="reportMeta">Loading latest data...</div>
      </div>
      <button id="copyBtn" onclick="copyTableToClipboard()">📋 Copy Image to Clipboard</button>
    </div>

    <div class="table-container" id="output">
      <div class="empty-state">Loading table data...</div>
    </div>
  </div>

  <div class="brand-footer">
    ATOMS Operations &copy; 2026
  </div>

<script>
async function loadData() {
  const meta = document.getElementById('reportMeta');
  const title = document.getElementById('reportTitle');
  const output = document.getElementById('output');

  // Strategy 1: Check URL hash parameter (#data=...)
  if (window.location.hash.startsWith('#data=')) {
    try {
      const rawHash = window.location.hash.replace('#data=', '');
      const jsonStr = decodeURIComponent(escape(atob(decodeURIComponent(rawHash))));
      const payload = JSON.parse(jsonStr);
      displayReport(payload);
      return;
    } catch (e) {
      console.warn("Failed parsing hash data:", e);
    }
  }

  // Strategy 2: Check localStorage (same machine / test session)
  const localData = localStorage.getItem('atom_tracker_live_data');
  if (localData) {
    try {
      const payload = JSON.parse(localData);
      displayReport(payload);
      return;
    } catch (e) {
      console.warn("Failed parsing local storage:", e);
    }
  }

  // Strategy 3: Check committed data.json file on GitHub Pages
  try {
    const res = await fetch('./data.json', { cache: 'no-store' });
    if (res.ok) {
      const payload = await res.json();
      displayReport(payload);
      return;
    }
  } catch (e) {
    console.log("No data.json found on server.");
  }

  // Fallback: No data available
  meta.textContent = "No data active";
  output.innerHTML = `
    <div class="empty-state">
      No report has been published yet.<br><br>
      Please open this page via an <b>Admin share link</b> or place <b>data.json</b> in your GitHub repository.
    </div>
  `;
}

function displayReport(payload) {
  const meta = document.getElementById('reportMeta');
  const title = document.getElementById('reportTitle');

  if (payload.day) {
    title.textContent = `Daily Ticket Summary — Day ${payload.day} (PHT)`;
  }
  if (payload.updatedAt) {
    meta.textContent = `Last published: ${payload.updatedAt}`;
  } else {
    meta.textContent = 'Active Report';
  }

  renderTable(payload.rows || payload);
}

function renderTable(data) {
  const outputDiv = document.getElementById('output');
  if (!data || data.length === 0) {
    outputDiv.innerHTML = `<div class="empty-state">No matching rows found in this report.</div>`;
    return;
  }

  let totals = { succ: 0, den: 0, ref: 0, cool: 0, esc: 0, exp: 0, total: 0 };
  let html = `<table id="summaryTable"><thead><tr><th class="assignee-header">Assignee</th><th>Successful</th><th>Denied</th><th>Already Refunded</th><th>Cool Off</th><th>Escalated</th><th>Expired</th><th>Total Order Disputed</th><th>Winrate</th></tr></thead><tbody>`;

  data.forEach(row => {
    totals.succ += row.successful; totals.den += row.denied; totals.ref += row.refunded;
    totals.cool += row.coolOff; totals.esc += row.escalated; totals.exp += row.expired;
    totals.total += row.totalDispute;

    html += `<tr><td class="text-left">${row.name}</td><td>${row.successful}</td><td>${row.denied}</td><td>${row.refunded}</td><td>${row.coolOff}</td><td>${row.escalated}</td><td>${row.expired}</td><td>${row.totalDispute}</td><td>${row.winRate.toFixed(2)}%</td></tr>`;
  });

  const overallWinRateDenom = totals.succ + totals.den + totals.cool;
  const overallWinRate = overallWinRateDenom > 0 ? (totals.succ / overallWinRateDenom * 100).toFixed(2) : "0.00";

  html += `<tr class="summary-row"><td class="text-left">Grand Total</td><td>${totals.succ}</td><td>${totals.den}</td><td>${totals.ref}</td><td>${totals.cool}</td><td>${totals.esc}</td><td>${totals.exp}</td><td>${totals.total}</td><td>${overallWinRate}%</td></tr></tbody></table>`;
  outputDiv.innerHTML = html;
}

async function copyTableToClipboard() {
  const table = document.getElementById('summaryTable');
  const btn = document.getElementById('copyBtn');

  if (!table) {
    alert("No table available to copy!");
    return;
  }

  try {
    btn.textContent = "⏳ Copying...";
    const canvas = await html2canvas(table, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    canvas.toBlob(async (blob) => {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      btn.textContent = "✅ Copied to Clipboard!";
      setTimeout(() => { btn.textContent = "📋 Copy Image to Clipboard"; }, 3000);
    }, 'image/png');
  } catch (err) {
    alert("Unable to copy to clipboard directly.");
    btn.textContent = "📋 Copy Image to Clipboard";
  }
}

window.addEventListener('DOMContentLoaded', loadData);
window.addEventListener('hashchange', loadData);
</script>
</body>
</html>
