<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Tickets - Agents</title>
    
    <!-- OT Favicon Icon for Browser Tab -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23000000'/><text x='50%' y='65%' font-family='sans-serif' font-weight='900' font-size='52' fill='%23ffffff' text-anchor='middle'>OT</text></svg>">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 15px; 
            background-color: #000000; 
            color: #ededed; 
            margin: 0;
            font-size: 13px;
        }
        .container { 
            max-width: 950px; 
            margin: 0 auto; 
            background: #0a0a0a; 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid #1c1c1e;
        }
        h1 { 
            margin: 0 0 15px 0; 
            color: #ffffff; 
            font-size: 1.3rem; 
            font-weight: 600; 
            letter-spacing: -0.5px;
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 10px; 
            margin-bottom: 12px; 
        }
        .form-group { display: flex; flex-direction: column; }
        label { 
            font-weight: 500; 
            margin-bottom: 4px; 
            font-size: 0.75em; 
            text-transform: uppercase; 
            color: #8e8e93; 
            letter-spacing: 0.5px;
        }
        input[type="file"], input[type="number"] { 
            padding: 6px 10px; 
            background-color: #121212;
            border: 1px solid #2c2c2e; 
            border-radius: 6px; 
            color: #ffffff;
            font-size: 0.85em;
            outline: none;
        }
        input[type="file"]::file-selector-button {
            background: #2c2c2e;
            color: #fff;
            border: none;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 8px;
            font-size: 0.8em;
        }
        input:focus { border-color: #0a84ff; }
        
        .actions { margin-top: 10px; margin-bottom: 15px; }
        button { 
            background-color: #ffffff; 
            color: #000000; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 0.85em;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.85; }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
            background-color: #0a0a0a;
            border: 1px solid #1c1c1e;
            border-radius: 6px;
            overflow: hidden;
        }
        th, td { 
            border-bottom: 1px solid #1c1c1e; 
            padding: 6px 10px; 
            text-align: center; 
            font-size: 0.82em;
        }
        th { 
            background-color: #121212; 
            font-weight: 600; 
            color: #8e8e93;
            text-transform: uppercase;
            font-size: 0.7em;
            letter-spacing: 0.5px;
        }
        td.text-left, th.text-left { text-align: left; }
        tr:last-child td { border-bottom: none; }
        tr:nth-child(even) { background-color: #0d0d0d; }
        
        td:nth-child(n+2) {
            font-variant-numeric: tabular-nums;
        }

        .export-container {
            margin-bottom: 12px;
            display: flex;
            justify-content: flex-end;
        }

        .btn-export {
            background-color: #0a84ff;
            color: #ffffff;
        }

        /* SLA Badge Styling */
        .sla-badge {
            background-color: #1a3d2f;
            color: #30d158;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.85em;
            display: inline-block;
            border: 1px solid #235d43;
        }
        .sla-badge.urgent {
            background-color: #3d1a1a;
            color: #ff453a;
            border: 1px solid #5d2323;
        }
        .sla-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AGENTS OPEN TICKETS</h1>
    
    <div class="grid">
        <div class="form-group">
            <label for="openFile">1. Open Tickets CSV</label>
            <input type="file" id="openFile" accept=".csv">
        </div>
        <div class="form-group">
            <label for="cooloffFile">2. Cool Off CSV</label>
            <input type="file" id="cooloffFile" accept=".csv">
        </div>
        <div class="form-group">
            <label for="disputedFile">3. Disputed CSV</label>
            <input type="file" id="disputedFile" accept=".csv">
        </div>
    </div>

    <div class="grid">
        <div class="form-group">
            <label for="filterDay">Filter Day of Month (Target Day)</label>
            <input type="number" id="filterDay" min="1" max="31" value="17" placeholder="e.g. 17">
        </div>
        <div class="form-group">
            <label for="targetQuota">Target Quota</label>
            <input type="number" id="targetQuota" value="300">
        </div>
    </div>

    <div class="actions">
        <button onclick="processCSVs()">Process Data</button>
    </div>

    <div id="output"></div>
</div>

<script>
let lastResults = []; 

const ROSTER = [
    "Kate Maglasang",
    "Hazel Versuela",
    "Eron Casuyac",
    "Jasmine Ceballos",
    "Melvin De Jesus",
    "Donna Cristobal",
    "Jenschelle Eslais",
    "Chaira Wata",
    "Maria Sale",
    "Daniela Jane Sulelom",
    "Daisy Beronilla",
    "Johas Camello",
    "Lloyd Propia",
    "Mark Ycong",
    "Miguel Angelo Geolina",
    "Saimor Panganiban",
    "Jeniel Ople",
    "Siti Quituar",
    "Jovir Domingo",
    "Kyll Enriquez",
    "Ralf Buyco",
    "Honey Claire Tanutan",
    "Jenamie Sagetarios",
    "Irene Simbajon",
    "Reynaldo Pajo",
    "Aljel Damalerio",
    "Jevelyn Jamero"
];

const EXCLUDED = ["Justine Parilla", "Aigel Albaran", "Elvie Estellore", "Ivy Algoso"];

function parseCSV(file) {
    return new Promise((resolve) => {
        if (!file) return resolve([]);
        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            transformHeader: h => h.trim().toLowerCase(),
            complete: results => resolve(results.data)
        });
    });
}

function getVal(row, possibleKeys) {
    for (let key of possibleKeys) {
        if (row[key] !== undefined && row[key] !== null && row[key].toString().trim() !== "") {
            return row[key].toString().trim();
        }
    }
    return "";
}

/**
 * Filter matching the logic in the Daily Tracker processor
 */
function isSamePHTShiftDay(dateStr, targetDay) {
    if (!dateStr) return false;

    // 1. First try matching exact day using regex pattern from tracker code (-MM-DD or -DD)
    const match = dateStr.match(/-\d{2}-?(\d{2})/);
    if (match) {
        return parseInt(match[1], 10) === parseInt(targetDay, 10);
    }

    // 2. Fallback to parsing as Date object
    let cleanStr = dateStr.replace(" UTC", "").replace(" PST", "").replace(" PHT", "").replace(' ', 'T');
    let dateObj = new Date(cleanStr);

    if (isNaN(dateObj.getTime())) {
        let parts = dateStr.split(/[\s/:-]+/);
        if (parts.length >= 3) {
            if (parts[0].length === 4) {
                dateObj = new Date(parts[0], parts[1] - 1, parts[2], parts[3] || 0, parts[4] || 0);
            } else {
                dateObj = new Date(parts[2], parts[0] - 1, parts[1], parts[3] || 0, parts[4] || 0);
            }
        }
    }

    if (isNaN(dateObj.getTime())) return false;

    let phtTime = new Date(dateObj.getTime() + (15 * 60 * 60 * 1000));
    if (phtTime.getHours() < 8) {
        phtTime.setDate(phtTime.getDate() - 1);
    }

    return phtTime.getDate() === parseInt(targetDay, 10);
}

function parseAnySLA(rawSlaVal, refTimeMs) {
    if (!rawSlaVal) return null;
    let str = rawSlaVal.trim();

    let diffMins = null;

    let d = str.match(/(\d+)\s*d/i);
    let h = str.match(/(\d+)\s*h/i);
    let m = str.match(/(\d+)\s*m/i);

    if (d || h || m) {
        diffMins = 0;
        if (d) diffMins += parseInt(d[1], 10) * 1440;
        if (h) diffMins += parseInt(h[1], 10) * 60;
        if (m) diffMins += parseInt(m[1], 10);
    } else {
        let parsedDate = new Date(str.replace(' ', 'T'));
        if (!isNaN(parsedDate.getTime())) {
            let diffMs = parsedDate.getTime() - refTimeMs;
            diffMins = Math.floor(diffMs / (1000 * 60));
        }
    }

    if (diffMins === null) {
        return { minutes: 99999, label: str };
    }

    if (diffMins <= 0) {
        return { minutes: diffMins, label: "Expired" };
    }

    let label = "";
    if (diffMins >= 1440) {
        let roundedDays = Math.ceil(diffMins / 1440);
        label = `${roundedDays}d`;
    } else if (diffMins >= 60) {
        let roundedHours = Math.ceil(diffMins / 60);
        label = `${roundedHours}h`;
    } else {
        label = `${diffMins}m`;
    }

    return { minutes: diffMins, label: label };
}

function extractRefTimeFromFilename(fileName, rows) {
    if (fileName) {
        let match = fileName.match(/(\d{4}-\d{2}-\d{2})[-_](\d{2})(\d{2})/);
        if (match) {
            let datePart = match[1];
            let hh = match[2];
            let mm = match[3];
            let d = new Date(`${datePart}T${hh}:${mm}:00`);
            if (!isNaN(d.getTime())) return d.getTime();
        }
    }
    let earliest = Infinity;
    const slaKeys = ["sla", "sla time", "time remaining", "remaining sla", "due in", "expires in"];
    rows.forEach(r => {
        let val = getVal(r, slaKeys);
        let dt = new Date(val.replace(' ', 'T'));
        if (!isNaN(dt.getTime()) && dt.getTime() < earliest) {
            earliest = dt.getTime();
        }
    });
    return earliest !== Infinity ? (earliest - (4 * 3600 * 1000)) : Date.now();
}

async function processCSVs() {
    const openFile = document.getElementById('openFile').files[0];
    const cooloffFile = document.getElementById('cooloffFile').files[0];
    const disputedFile = document.getElementById('disputedFile').files[0];
    const filterDay = document.getElementById('filterDay').value;
    const quota = parseInt(document.getElementById('targetQuota').value) || 300;

    if (!filterDay) {
        alert("Please specify a Day of the Month (1-31).");
        return;
    }

    const [openData, cooloffData, disputedData] = await Promise.all([
        parseCSV(openFile),
        parseCSV(cooloffFile),
        parseCSV(disputedFile)
    ]);

    let activeAgents = ROSTER.filter(agent => !EXCLUDED.includes(agent));

    let metrics = {};
    activeAgents.forEach(agent => {
        metrics[agent] = { open: 0, cooloff: 0, disputed: 0, slaList: [] };
    });

    const agentKeys = ["assignee", "agent", "name", "assignee name", "solved by", "agent name", "user", "submitter", "updater"];
    const timeKeys = ["assignee updated", "updated", "updated at", "solved at", "requested", "created at", "timestamp", "date", "created date", "created"];
    const statusKeys = ["ticket status", "status"];
    const slaKeys = ["sla", "sla time", "time remaining", "remaining sla", "due in", "expires in", "sla status"];

    let refTimeMs = extractRefTimeFromFilename(openFile ? openFile.name : "", openData);

    // 1. Process Open Tickets
    openData.forEach(row => {
        let agent = getVal(row, agentKeys);
        let status = getVal(row, statusKeys);
        let slaStr = getVal(row, slaKeys);

        let matchedAgent = activeAgents.find(a => a.toLowerCase() === agent.toLowerCase());
        if (matchedAgent && (status.toLowerCase() === "open" || status === "")) {
            metrics[matchedAgent].open++;
            
            let slaObj = parseAnySLA(slaStr, refTimeMs);
            if (slaObj) {
                metrics[matchedAgent].slaList.push(slaObj);
            }
        }
    });

    // 2. Process Cool Off Tickets
    cooloffData.forEach(row => {
        let agent = getVal(row, agentKeys);
        let status = getVal(row, statusKeys);

        let matchedAgent = activeAgents.find(a => a.toLowerCase() === agent.toLowerCase());
        if (matchedAgent && (status.toLowerCase() === "cool off" || status === "")) {
            metrics[matchedAgent].cooloff++;
        }
    });

    // Valid dispute status criteria matching Code 1
    const validDisputeStatuses = ['successful', 'unsuccessful', 'denied', 'already refunded', 'cool off', 'escalated', 'expired'];

    // 3. Process Disputed Tickets (Filtered strictly like Daily Tracker)
    disputedData.forEach(row => {
        let agent = getVal(row, agentKeys);
        let timeStr = getVal(row, timeKeys);
        let status = getVal(row, statusKeys).toLowerCase();

        let matchedAgent = activeAgents.find(a => a.toLowerCase() === agent.toLowerCase());
        
        if (matchedAgent) {
            // Check if status is a valid dispute or default if blank
            const isValidStatus = status === "" || validDisputeStatuses.includes(status);
            
            if (isValidStatus && isSamePHTShiftDay(timeStr, filterDay)) {
                metrics[matchedAgent].disputed++;
            }
        }
    });

    lastResults = activeAgents.map(agent => {
        let open = metrics[agent].open;
        let cool = metrics[agent].cooloff;
        let disp = metrics[agent].disputed;
        let slaList = metrics[agent].slaList;
        let totalProcessed = open + cool + disp;
        let needed = quota - totalProcessed;

        slaList.sort((a, b) => a.minutes - b.minutes);

        let slaSummary = "-";
        let isUrgent = false;

        if (slaList.length === 1) {
            slaSummary = slaList[0].label;
            if (slaList[0].minutes <= 1440) isUrgent = true;
        } else if (slaList.length > 1) {
            let lowest = slaList[0].label;
            let highest = slaList[slaList.length - 1].label;

            slaSummary = (lowest === highest) ? lowest : `${lowest} - ${highest}`;
            if (slaList[0].minutes <= 1440) isUrgent = true;
        }

        return { agent, open, cool, disp, needed, slaSummary, isUrgent, totalProcessed };
    }).sort((a, b) => b.disp - a.disp);

    renderTable(lastResults);
}

function exportForTampermonkey() {
    const queue = lastResults
        .filter(r => r.needed > 0)
        .map(r => ({ agent: r.agent, count: r.needed }));

    const dayVal = document.getElementById('filterDay').value || 'export';
    const blob = new Blob([JSON.stringify(queue, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `agent_assignment_queue_day_${dayVal}.json`;
    a.click();
    URL.revokeObjectURL(url);
}

function renderTable(data) {
    let html = `<div class="export-container">
        <button onclick="exportForTampermonkey()" class="btn-export">
            📥 Export Tampermonkey Queue JSON
        </button>
    </div>`;

    html += `<table id="resultsTable">
        <thead>
            <tr>
                <th class="text-left">Assignee</th>
                <th>Open Tickets</th>
                <th>Cool Off Tickets</th>
                <th>Total Tickets Disputed</th>
                <th>Needed Tickets</th>
                <th>SLA</th>
            </tr>
        </thead>
        <tbody>`;

    data.forEach(r => {
        let neededColor = r.needed < 0 ? '#ff453a' : '#30d158';
        let badgeClass = r.isUrgent ? 'sla-badge urgent' : 'sla-badge';

        let slaHtml = r.slaSummary !== "-" 
            ? `<div class="sla-container"><span class="${badgeClass}">${r.slaSummary}</span></div>` 
            : `<span style="color: #666;">-</span>`;

        html += `<tr>
            <td class="text-left">${r.agent}</td>
            <td>${r.open}</td>
            <td>${r.cool}</td>
            <td><b>${r.disp}</b></td>
            <td><span style="color:${neededColor}; font-weight:bold;">${r.needed}</span></td>
            <td>${slaHtml}</td>
        </tr>`;
    });

    html += `</tbody></table>`;
    document.getElementById('output').innerHTML = html;
}
</script>
</body>
</html>
