            justify-content: center;

function setupDropZone(zoneId, inputId, labelId) {
    const dropZone = document.getElementById(zoneId);
    const input = document.getElementById(inputId);
    const label = document.getElementById(labelId);

    dropZone.addEventListener('click', () => input.click());

    input.addEventListener('change', () => {
        if (input.files.length) {
            label.innerHTML = "Loaded: <span>" + input.files[0].name + "</span>";
        }
    });

    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.add('dragover');
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.remove('dragover');
        }, false);
    });

    dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;

        if (files.length) {
            if (files[0].name.endsWith('.csv')) {
                input.files = files;
                label.innerHTML = "Loaded: <span>" + files[0].name + "</span>";
            } else {
                alert("Please drop a valid .csv file!");
            }
        }
    });
}

function parseCSV(file) {
    return new Promise((resolve) => {
        if (!file) return resolve([]);
        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            transformHeader: h => h.trim().toLowerCase(),
            complete: results => resolve(results.data)
        });
    });
}

function getVal(row, possibleKeys) {
    for (let key of possibleKeys) {
        if (row[key] !== undefined && row[key] !== null && row[key].toString().trim() !== "") {
            return row[key].toString().trim();
        }
    }
    return "";
}

function parseRawTimestamp(dateStr) {
    if (!dateStr || dateStr === "'-" || dateStr === "-") return NaN;
    let cleanStr = dateStr.trim();
    let parts = cleanStr.match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/);
    if (parts) {
        return Date.UTC(parseInt(parts[1]), parseInt(parts[2]) - 1, parseInt(parts[3]), parseInt(parts[4]), parseInt(parts[5]));
    }
    return Date.parse(cleanStr);
}

function isSamePHTShiftDay(dateStr, targetDay) {
    if (!dateStr) return false;

    const match = dateStr.match(/-\d{2}-?(\d{2})/);
    if (match) {
        return parseInt(match[1], 10) === parseInt(targetDay, 10);
    }

    let parsedMs = parseRawTimestamp(dateStr);
    if (isNaN(parsedMs)) return false;

    let phtTime = new Date(parsedMs + (8 * 60 * 60 * 1000)); 
    if (phtTime.getUTCHours() < 8) {
        phtTime.setUTCDate(phtTime.getUTCDate() - 1);
    }

    return phtTime.getUTCDate() === parseInt(targetDay, 10);
}

function formatZendeskSLA(diffMins) {
    if (diffMins === null || isNaN(diffMins)) return "-";

    let prefix = diffMins < 0 ? "-" : "";
    let absMins = Math.abs(diffMins);

    if (absMins < 60) {
        return prefix + absMins + "m";
    } else if (absMins < 1440) {
        let hours = Math.floor(absMins / 60);
        return prefix + hours + "h";
    } else {
        let days = Math.floor(absMins / 1440);
        return prefix + days + "d";
    }
}

function parseAnySLA(rawSlaVal, refTimeMs) {
    if (!rawSlaVal || typeof rawSlaVal !== 'string' || rawSlaVal === "'-" || rawSlaVal === "-") return null;
    let str = rawSlaVal.trim();
    let diffMins = null;

    let d = str.match(/^(-?\d+)\s*d/i);
    let h = str.match(/^(-?\d+)\s*h/i);
    let m = str.match(/^(-?\d+)\s*m/i);

    if (d || h || m) {
        diffMins = 0;
        if (d) diffMins += parseInt(d[1], 10) * 1440;
        if (h) diffMins += parseInt(h[1], 10) * 60;
        if (m) diffMins += parseInt(m[1], 10);
    } else {
        let parsedMs = parseRawTimestamp(str);
        if (!isNaN(parsedMs)) {
            let diffMs = parsedMs - refTimeMs;
            diffMins = Math.round(diffMs / (1000 * 60));
        }
    }

    if (diffMins === null) {
        return { minutes: 99999, label: str };
    }

    return { 
        minutes: diffMins, 
        label: formatZendeskSLA(diffMins)
    };
}

function extractRefTimeFromFilename(fileObj, rows) {
    if (fileObj && fileObj.name) {
        let match = fileObj.name.match(/(\d{4})-(\d{2})-(\d{2})[-_](\d{2})(\d{2})/);
        if (match) {
            let year = parseInt(match[1]);
            let month = parseInt(match[2]) - 1;
            let day = parseInt(match[3]);
            let hh = parseInt(match[4]);
            let mm = parseInt(match[5]);
            return Date.UTC(year, month, day, hh, mm);
        }
    }
    
    let earliestSlaMs = Infinity;
    const slaKeys = ["sla", "sla time", "time remaining", "remaining sla", "due in", "expires in", "next sla breach", "sla breach", "sla_next_breach_at"];
    rows.forEach(r => {
        let val = getVal(r, slaKeys);
        let parsedMs = parseRawTimestamp(val);
        if (!isNaN(parsedMs) && parsedMs < earliestSlaMs) {
            earliestSlaMs = parsedMs;
        }
    });

    if (earliestSlaMs !== Infinity) {
        return earliestSlaMs - (7 * 60 * 1000); 
    }

    return Date.now();
}

async function processCSVs() {
    const openFile = document.getElementById('openFile').files[0];
    const cooloffFile = document.getElementById('cooloffFile').files[0];
    const disputedFile = document.getElementById('disputedFile').files[0];
    const filterDay = document.getElementById('filterDay').value;
    const quota = parseInt(document.getElementById('targetQuota').value) || 300;

    if (!filterDay) {
        alert("Please specify a Day of the Month (1-31).");
        return;
    }

    const [openData, cooloffData, disputedData] = await Promise.all([
        parseCSV(openFile),
        parseCSV(cooloffFile),
        parseCSV(disputedFile)
    ]);

    let activeAgents = ROSTER.filter(agent => !EXCLUDED.includes(agent));

    let metrics = {};
    activeAgents.forEach(agent => {
        metrics[agent] = { open: 0, cooloff: 0, disputed: 0, slaList: [] };
    });

    const agentKeys = [
        "assignee", "agent", "name", "assignee name", "solved by", 
        "agent name", "user", "submitter", "updater", "assignee_name", "agent_name"
    ];
    
    // Prioritize "solved" first for new prod exported headers
    const timeKeys = [
        "solved", "solved at", "solved_at",
        "assignee updated", "updated", "updated at", 
        "requested", "created at", "timestamp", "date", "created date", 
        "created", "updated_at", "created_at", "last updated"
    ];
    const statusKeys = [
        "ticket status", "status", "state", "ticket_status"
    ];
    const slaKeys = [
        "sla", "sla time", "time remaining", "remaining sla", 
        "due in", "expires in", "sla status", "next sla breach", 
        "sla breach", "sla_next_breach_at"
    ];

    let refTimeMs = extractRefTimeFromFilename(openFile, openData);

    openData.forEach(row => {
        let agent = getVal(row, agentKeys);
        let status = getVal(row, statusKeys);
        let slaStr = getVal(row, slaKeys);

        let matchedAgent = activeAgents.find(a => a.toLowerCase() === agent.toLowerCase());
        if (matchedAgent && (status.toLowerCase() === "open" || status === "")) {
            metrics[matchedAgent].open++;
            
            let slaObj = parseAnySLA(slaStr, refTimeMs);
            if (slaObj) {
                metrics[matchedAgent].slaList.push(slaObj);
            }
        }
    });

    cooloffData.forEach(row => {
        let agent = getVal(row, agentKeys);
        let status = getVal(row, statusKeys);

        let matchedAgent = activeAgents.find(a => a.toLowerCase() === agent.toLowerCase());
        if (matchedAgent && (status.toLowerCase() === "cool off" || status.toLowerCase() === "cooloff" || status === "")) {
            metrics[matchedAgent].cooloff++;
        }
    });

    // Excluded 'expired' from valid dispute statuses
    const validDisputeStatuses = ['successful', 'unsuccessful', 'denied', 'already refunded', 'cool off', 'escalated', 'closed', 'solved'];

    disputedData.forEach(row => {
        let agent = getVal(row, agentKeys);
        let timeStr = getVal(row, timeKeys);
        let status = getVal(row, statusKeys).toLowerCase();

        let matchedAgent = activeAgents.find(a => a.toLowerCase() === agent.toLowerCase());
        
        if (matchedAgent) {
            const isValidStatus = status === "" || validDisputeStatuses.includes(status);
            
            if (isValidStatus && isSamePHTShiftDay(timeStr, filterDay)) {
                metrics[matchedAgent].disputed++;
            }
        }
    });

    lastResults = activeAgents.map(agent => {
        let open = metrics[agent].open;
        let cool = metrics[agent].cooloff;
        let disp = metrics[agent].disputed;
        let slaList = metrics[agent].slaList;
        let agentsTicket = open + disp;
        let totalProcessed = open + cool + disp;
        let needed = quota - totalProcessed;

        slaList.sort((a, b) => a.minutes - b.minutes);

        let slaSummary = "-";
        let isUrgent = false;

        if (slaList.length === 1) {
            slaSummary = slaList[0].label;
            if (slaList[0].minutes <= 60) isUrgent = true;
        } else if (slaList.length > 1) {
            let lowest = slaList[0].label;
            let highest = slaList[slaList.length - 1].label;

            slaSummary = (lowest === highest) ? lowest : (lowest + " -" + highest);
            if (slaList[0].minutes <= 60) isUrgent = true;
        }

        return {
            agent,
            shiftTime: AGENT_TIMES[agent] || "",
            open,
            cool,
            disp,
            agentsTicket,
            needed,
            slaSummary,
            isUrgent,
            totalProcessed
        };
    });

    renderViews(lastResults);
}

function setScheduleFilter(filterType) {
    currentScheduleFilter = filterType;
    if (lastResults.length > 0) {
        renderViews(lastResults);
    }
}

function setViewMode(mode) {
    currentViewMode = mode;
    if (lastResults.length > 0) {
        renderViews(lastResults);
    }
}

function getSortedPrimaryAgents(data, filterType) {
    let primaryData = data.filter(r => !SECONDARY_AGENTS.includes(r.agent) && !excludedCSR1Agents.has(r.agent));

    if (filterType === 'liveagents') {
        primaryData = primaryData.filter(r => LIVE_AGENTS.includes(r.agent));
    } else if (filterType === 'seasonalagents') {
        primaryData = primaryData.filter(r => SEASONAL_AGENTS.includes(r.agent));
        return primaryData.sort((a, b) => {
            return SEASONAL_AGENTS.indexOf(a.agent) - SEASONAL_AGENTS.indexOf(b.agent);
        });
    } else if (filterType === 'otheragents') {
        primaryData = primaryData.filter(r => !LIVE_AGENTS.includes(r.agent) && !SEASONAL_AGENTS.includes(r.agent));
    } else if (filterType === 'frisat') {
        primaryData = primaryData.filter(r => FRI_SAT_AGENTS.includes(r.agent));
    } else if (filterType === 'sunmon') {
        primaryData = primaryData.filter(r => SUN_MON_AGENTS.includes(r.agent));
    } else {
        // 'all' filter: Exclude LIVE_AGENTS and SEASONAL_AGENTS from All CSR 1
        primaryData = primaryData.filter(r => !LIVE_AGENTS.includes(r.agent) && !SEASONAL_AGENTS.includes(r.agent));
    }

    // Organize chronologically by shift time (6PM -> 8PM -> 10PM -> 12AM -> 2AM)
    return primaryData.sort(sortByShiftTime);
}

/* RANDOMIZED EXPORT FOR TAMPERMONKEY QUEUE */
function exportForTampermonkey() {
    const primaryData = getSortedPrimaryAgents(lastResults, currentScheduleFilter);

    let queue = primaryData
        .filter(r => r.needed > 0)
        .map(r => ({ agent: r.agent, count: r.needed }));

    // Fisher-Yates Randomization Algorithm
    for (let i = queue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [queue[i], queue[j]] = [queue[j], queue[i]];
    }

    const dayVal = document.getElementById('filterDay').value || 'export';
    const blob = new Blob([JSON.stringify(queue, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = "agent_assignment_queue_" + currentScheduleFilter + "_day_" + dayVal + "_randomized.json";
    a.click();
    URL.revokeObjectURL(url);
}

/* COPY ONLY THE TABLE / GRID ELEMENT ITSELF (EXCLUDES TITLES, CSR 2, & NEEDED TICKETS) */
async function copyViewImageToClipboard() {
    const btn = document.getElementById('copyImgBtnMain');
    
    // Target strictly the primary table or primary grid element
    const targetElement = currentViewMode === 'list' 
        ? document.getElementById('primaryTable') 
        : document.getElementById('primaryGrid');

    if (!targetElement || lastResults.length === 0) {
        alert("No view data available to copy!");
        return;
    }

    try {
        btn.textContent = "⏳ Copying Image...";

        const canvas = await html2canvas(targetElement, {
            scale: 2,
            backgroundColor: currentViewMode === 'list' ? '#ffffff' : '#0a0a0a',
            logging: false,
            useCORS: true,
            onclone: (clonedDoc) => {
                clonedDoc.querySelectorAll('.needed-col, .needed-stat').forEach(el => {
                    el.style.display = 'none';
                });
            }
        });

        canvas.toBlob(async (blob) => {
            if (!blob) {
                alert("Failed to render image blob.");
                btn.textContent = currentViewMode === 'list' ? "📷 Copy Table Image" : "📷 Copy Card View Image";
                return;
            }

            await navigator.clipboard.write([
                new ClipboardItem({ 'image/png': blob })
            ]);

            btn.textContent = "✅ Image Copied!";
            setTimeout(() => {
                btn.textContent = currentViewMode === 'list' ? "📷 Copy Table Image" : "📷 Copy Card View Image";
            }, 3000);

        }, 'image/png');

    } catch (err) {
        console.error("Clipboard image copy failed:", err);
        alert("Unable to copy image directly to clipboard!");
        btn.textContent = currentViewMode === 'list' ? "📷 Copy Table Image" : "📷 Copy Card View Image";
    }
}

/* COPY INDIVIDUAL AGENT CARD TO CLIPBOARD (EXCLUDES NEEDED TICKETS) */
async function copySingleCardImage(btnElement, cardId) {
    const card = document.getElementById(cardId);
    if (!card) return;

    const originalText = btnElement.textContent;

    try {
        btnElement.textContent = "⏳ Copying...";

        btnElement.style.display = 'none';

        const canvas = await html2canvas(card, {
            scale: 2,
            backgroundColor: '#ffffff',
            logging: false,
            useCORS: true,
            onclone: (clonedDoc) => {
                clonedDoc.querySelectorAll('.needed-col, .needed-stat').forEach(el => {
                    el.style.display = 'none';
                });
            }
        });

        btnElement.style.display = 'inline-block';

        canvas.toBlob(async (blob) => {
            if (!blob) {
                alert("Failed to render card image blob.");
                btnElement.textContent = originalText;
                return;
            }

            await navigator.clipboard.write([
                new ClipboardItem({ 'image/png': blob })
            ]);

            btnElement.textContent = "✅ Copied!";
            setTimeout(() => {
                btnElement.textContent = originalText;
            }, 2500);

        }, 'image/png');

    } catch (err) {
        console.error("Card image copy failed:", err);
        btnElement.style.display = 'inline-block';
        alert("Unable to copy card image to clipboard!");
        btnElement.textContent = originalText;
    }
}

/* 1. GENERATES TABLE/LIST VIEW HTML */

                '<th>Cool Off Tickets</th>' +
                '<th>Total Tickets Disputed</th>' +
                '<th>Agents Ticket</th>' +
                '<th class="needed-col">Needed Tickets</th>' +
                '<th>SLA</th>' +
            '</tr>' +
        '</thead>' +
        '<tbody>';

    dataList.forEach(r => {
        let neededColor = r.needed < 0 ? '#dc2626' : '#16a34a';
        let badgeClass = r.isUrgent ? 'sla-badge urgent' : 'sla-badge';
        let agentsTicket = r.open + r.disp;

        let slaHtml = r.slaSummary !== "-" 
            ? '<span class="' + badgeClass + '">' + r.slaSummary + '</span>' 
            : '<span style="color: #9ca3af;">-</span>';

            ? '<button data-html2canvas-ignore="true" class="btn-remove-agent" onclick="removeCSR1Agent(\'' + r.agent.replace(/'/g, "\\'") + '\')" title="Remove agent (Absent/Leave)">✕</button>'

        html += '<tr>' +
            '<td class="text-left">' +

                    '<div class="assignee-left">' + removeBtn + '<span>' + r.agent + '</span></div>' +
                    shiftTag +

            '</td>' +
            '<td>' + r.open + '</td>' +
            '<td>' + r.cool + '</td>' +
            '<td><b>' + r.disp + '</b></td>' +
            '<td><b>' + agentsTicket + '</b></td>' +
            '<td class="needed-col"><span style="color:' + neededColor + '; font-weight:bold;">' + r.needed + '</span></td>' +
            '<td>' + slaHtml + '</td>' +
        '</tr>';
    });

    html += '</tbody></table>';
    return html;
}

        '<button class="btn-filter ' + (currentScheduleFilter === 'seasonalagents' ? 'active' : '') + '" onclick="setScheduleFilter(\'seasonalagents\')">Seasonal Agents</button>' +
        '<button class="btn-filter ' + (currentScheduleFilter === 'otheragents' ? 'active' : '') + '" onclick="setScheduleFilter(\'otheragents\')">Other Agents</button>' +

            '🔄 Restore Removed CSR 1 (' + excludedCSR1Agents.size + ')' +
        '</button>';
    }
    html += '' +
        '<button onclick="copyViewImageToClipboard()" id="copyImgBtnMain" class="btn-copy-img-main">' +
            copyBtnLabel +
        '</button>' +
        '<button onclick="exportForTampermonkey()" class="btn-export">' +
            '🎲 Export Randomized Tampermonkey Queue JSON (' + currentScheduleFilter.toUpperCase() + ')' +
        '</button>' +
    '</div>';

    html += '<div id="viewRenderContainer">';

    let groupTitle = "CSR 1 Agents";
    if (currentScheduleFilter === 'liveagents') groupTitle = "Live Agents";
    if (currentScheduleFilter === 'seasonalagents') groupTitle = "Seasonal Agents";
    if (currentScheduleFilter === 'otheragents') groupTitle = "CSR 1 Agents (Other Agents)";
    if (currentScheduleFilter === 'frisat') groupTitle = "CSR 1 Agents (Fri - Sat Schedule)";
    if (currentScheduleFilter === 'sunmon') groupTitle = "CSR 1 Agents (Sun - Mon Schedule)";

    html += '<h2 class="table-title">' + groupTitle + '</h2>';

        ? generateTableHTML(primaryData, "primaryTable", true)
        : generateCardViewHTML(primaryData, "primaryGrid", true);

        ? generateTableHTML(secondaryData, "secondaryTable", false)
        : generateCardViewHTML(secondaryData, "secondaryGrid", false);

    html += '</div>';

    document.getElementById('output').innerHTML = html;
}
