<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Tickets - Agents</title>
    
    <!-- OT Favicon Icon for Browser Tab -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23000000'/><text x='50%' y='65%' font-family='sans-serif' font-weight='900' font-size='52' fill='%23ffffff' text-anchor='middle'>OT</text></svg>">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 15px; 
            background-color: #000000; 
            color: #ededed; 
            margin: 0;
            font-size: 13px;
        }
        .container { 
            max-width: 950px; 
            margin: 0 auto; 
            background: #0a0a0a; 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid #1c1c1e;
        }
        h1 { 
            margin: 0 0 15px 0; 
            color: #ffffff; 
            font-size: 1.3rem; 
            font-weight: 600; 
            letter-spacing: -0.5px;
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 12px; 
            margin-bottom: 12px; 
        }
        .form-group { display: flex; flex-direction: column; }
        label { 
            font-weight: 500; 
            margin-bottom: 6px; 
            font-size: 0.75em; 
            text-transform: uppercase; 
            color: #8e8e93; 
            letter-spacing: 0.5px;
        }

        /* DRAG & DROP ZONE STYLES */
        .drop-zone {
            border: 2px dashed #2c2c2e;
            border-radius: 8px;
            padding: 12px 10px;
            text-align: center;
            background-color: #121212;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 52px;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: #0a84ff;
            background-color: #1a1a1e;
        }

        .drop-zone-text {
            font-size: 0.85em;
            color: #8e8e93;
            pointer-events: none;
        }

        .drop-zone-text span {
            color: #ffffff;
            font-weight: 600;
        }

        input[type="file"] { display: none; }

        input[type="number"] { 
            padding: 8px 10px; 
            background-color: #121212;
            border: 1px solid #2c2c2e; 
            border-radius: 6px; 
            color: #ffffff;
            font-size: 0.85em;
            outline: none;
            height: 52px;
        }
        input:focus { border-color: #0a84ff; }
        
        .actions { margin-top: 10px; margin-bottom: 15px; }
        button { 
            background-color: #ffffff; 
            color: #000000; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 0.85em;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.85; }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
            background-color: #0a0a0a;
            border: 1px solid #1c1c1e;
            border-radius: 6px;
            overflow: hidden;
        }
        th, td { 
            border-bottom: 1px solid #1c1c1e; 
            padding: 6px 10px; 
            text-align: center; 
            font-size: 0.82em;
        }
        th { 
            background-color: #121212; 
            font-weight: 600; 
            color: #8e8e93;
            text-transform: uppercase;
            font-size: 0.7em;
            letter-spacing: 0.5px;
        }
        td.text-left, th.text-left { text-align: left; }
        tr:last-child td { border-bottom: none; }
        tr:nth-child(even) { background-color: #0d0d0d; }
        
        td:nth-child(n+2) {
            font-variant-numeric: tabular-nums;
        }

        .export-container {
            margin-bottom: 12px;
            display: flex;
            justify-content: flex-end;
        }

        .btn-export {
            background-color: #0a84ff;
            color: #ffffff;
        }

        /* SLA Badge Styling */
        .sla-badge {
            background-color: #1a3d2f;
            color: #30d158;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.85em;
            display: inline-block;
            border: 1px solid #235d43;
        }
        .sla-badge.urgent {
            background-color: #3d1a1a;
            color: #ff453a;
            border: 1px solid #5d2323;
        }
        .sla-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AGENTS OPEN TICKETS</h1>
    
    <div class="grid">
        <div class="form-group">
            <label>1. Open Tickets CSV</label>
            <div class="drop-zone" id="dropZoneOpen">
                <div class="drop-zone-text" id="labelOpen">Drag & drop CSV or <span>browse</span></div>
                <input type="file" id="openFile" accept=".csv">
            </div>
        </div>
        <div class="form-group">
            <label>2. Cool Off CSV</label>
            <div class="drop-zone" id="dropZoneCooloff">
                <div class="drop-zone-text" id="labelCooloff">Drag & drop CSV or <span>browse</span></div>
                <input type="file" id="cooloffFile" accept=".csv">
            </div>
        </div>
        <div class="form-group">
            <label>3. Disputed CSV</label>
            <div class="drop-zone" id="dropZoneDisputed">
                <div class="drop-zone-text" id="labelDisputed">Drag & drop CSV or <span>browse</span></div>
                <input type="file" id="disputedFile" accept=".csv">
            </div>
        </div>
    </div>

    <div class="grid">
        <div class="form-group">
            <label for="filterDay">Filter Day of Month (Target Day)</label>
            <input type="number" id="filterDay" min="1" max="31" value="" placeholder="e.g. 17">
        </div>
        <div class="form-group">
            <label for="targetQuota">Target Quota</label>
            <input type="number" id="targetQuota" value="300">
        </div>
    </div>

    <div class="actions">
        <button onclick="processCSVs()">Process Data</button>
    </div>

    <div id="output"></div>
</div>

<script>
let lastResults = []; 

const ROSTER = [
    "Kate Maglasang",
    "Hazel Versuela",
    "Eron Casuyac",
    "Jasmine Ceballos",
    "Melvin De Jesus",
    "Donna Cristobal",
    "Jenschelle Eslais",
    "Chaira Wata",
    "Maria Sale",
    "Daniela Jane Sulelom",
    "Daisy Beronilla",
    "Johas Camello",
    "Lloyd Propia",
    "Mark Ycong",
    "Miguel Angelo Geolina",
    "Saimor Panganiban",
    "Jeniel Ople",
    "Siti Quituar",
    "Jovir Domingo",
    "Kyll Enriquez",
    "Ralf Buyco",
    "Honey Claire Tanutan",
    "Jenamie Sagetarios",
    "Irene Simbajon",
    "Reynaldo Pajo",
    "Aljel Damalerio",
    "Jevelyn Jamero"
];

const EXCLUDED = ["Justine Parilla", "Aigel Albaran", "Elvie Estellore", "Ivy Algoso"];

function setupDropZone(zoneId, inputId, labelId) {
    const dropZone = document.getElementById(zoneId);
    const input = document.getElementById(inputId);
    const label = document.getElementById(labelId);

    dropZone.addEventListener('click', () => input.click());

    input.addEventListener('change', () => {
        if (input.files.length) {
            label.innerHTML = `Loaded: <span>${input.files[0].name}</span>`;
        }
    });

    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.add('dragover');
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.remove('dragover');
        }, false);
    });

    dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;

        if (files.length) {
            if (files[0].name.endsWith('.csv')) {
                input.files = files;
                label.innerHTML = `Loaded: <span>${files[0].name}</span>`;
            } else {
                alert("Please drop a valid .csv file!");
            }
        }
    });
}

setupDropZone('dropZoneOpen', 'openFile', 'labelOpen');
setupDropZone('dropZoneCooloff', 'cooloffFile', 'labelCooloff');
setupDropZone('dropZoneDisputed', 'disputedFile', 'labelDisputed');

function parseCSV(file) {
    return new Promise((resolve) => {
        if (!file) return resolve([]);
        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            transformHeader: h => h.trim().toLowerCase(),
            complete: results => resolve(results.data)
        });
    });
}

function getVal(row, possibleKeys) {
    for (let key of possibleKeys) {
        if (row[key] !== undefined && row[key] !== null && row[key].toString().trim() !== "") {
            return row[key].toString().trim();
        }
    }
    return "";
}

function parseRawTimestamp(dateStr) {
    if (!dateStr) return NaN;
    let cleanStr = dateStr.trim();
    // Parse timestamp directly without adding local offset shifts
    let parts = cleanStr.match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/);
    if (parts) {
        return Date.UTC(parseInt(parts[1]), parseInt(parts[2]) - 1, parseInt(parts[3]), parseInt(parts[4]), parseInt(parts[5]));
    }
    return Date.parse(cleanStr);
}

function isSamePHTShiftDay(dateStr, targetDay) {
    if (!dateStr) return false;

    const match = dateStr.match(/-\d{2}-?(\d{2})/);
    if (match) {
        return parseInt(match[1], 10) === parseInt(targetDay, 10);
    }

    let parsedMs = parseRawTimestamp(dateStr);
    if (isNaN(parsedMs)) return false;

    let phtTime = new Date(parsedMs + (8 * 60 * 60 * 1000)); 
    if (phtTime.getUTCHours() < 8) {
        phtTime.setUTCDate(phtTime.getUTCDate() - 1);
    }

    return phtTime.getUTCDate() === parseInt(targetDay, 10);
}

function formatZendeskSLA(diffMins) {
    if (diffMins === null || isNaN(diffMins)) return "-";

    let prefix = diffMins < 0 ? "-" : "";
    let absMins = Math.abs(diffMins);

    if (absMins < 60) {
        return `${prefix}${absMins}m`;
    } else if (absMins < 1440) {
        let hours = Math.floor(absMins / 60);
        return `${prefix}${hours}h`;
    } else {
        let days = Math.floor(absMins / 1440);
        return `${prefix}${days}d`;
    }
}

function parseAnySLA(rawSlaVal, refTimeMs) {
    if (!rawSlaVal || typeof rawSlaVal !== 'string') return null;
    let str = rawSlaVal.trim();
    let diffMins = null;

    let d = str.match(/^(-?\d+)\s*d/i);
    let h = str.match(/^(-?\d+)\s*h/i);
    let m = str.match(/^(-?\d+)\s*m/i);

    if (d || h || m) {
        diffMins = 0;
        if (d) diffMins += parseInt(d[1], 10) * 1440;
        if (h) diffMins += parseInt(h[1], 10) * 60;
        if (m) diffMins += parseInt(m[1], 10);
    } else {
        let parsedMs = parseRawTimestamp(str);
        if (!isNaN(parsedMs)) {
            let diffMs = parsedMs - refTimeMs;
            diffMins = Math.round(diffMs / (1000 * 60));
        }
    }

    if (diffMins === null) {
        return { minutes: 99999, label: str };
    }

    return { 
        minutes: diffMins, 
        label: formatZendeskSLA(diffMins)
    };
}

function extractRefTimeFromFilename(fileObj, rows) {
    // 1. Try to extract exact export timestamp from CSV Filename
    if (fileObj && fileObj.name) {
        let match = fileObj.name.match(/(\d{4})-(\d{2})-(\d{2})[-_](\d{2})(\d{2})/);
        if (match) {
            let year = parseInt(match[1]);
            let month = parseInt(match[2]) - 1;
            let day = parseInt(match[3]);
            let hh = parseInt(match[4]);
            let mm = parseInt(match[5]);
            return Date.UTC(year, month, day, hh, mm);
        }
    }
    
    // 2. Fallback: Lowest SLA timestamp in dataset - 7 minutes
    let earliestSlaMs = Infinity;
    const slaKeys = ["sla", "sla time", "time remaining", "remaining sla", "due in", "expires in"];
    rows.forEach(r => {
        let val = getVal(r, slaKeys);
        let parsedMs = parseRawTimestamp(val);
        if (!isNaN(parsedMs) && parsedMs < earliestSlaMs) {
            earliestSlaMs = parsedMs;
        }
    });

    if (earliestSlaMs !== Infinity) {
        return earliestSlaMs - (7 * 60 * 1000); 
    }

    return Date.now();
}

async function processCSVs() {
    const openFile = document.getElementById('openFile').files[0];
    const cooloffFile = document.getElementById('cooloffFile').files[0];
    const disputedFile = document.getElementById('disputedFile').files[0];
    const filterDay = document.getElementById('filterDay').value;
    const quota = parseInt(document.getElementById('targetQuota').value) || 300;

    if (!filterDay) {
        alert("Please specify a Day of the Month (1-31).");
        return;
    }

    const [openData, cooloffData, disputedData] = await Promise.all([
        parseCSV(openFile),
        parseCSV(cooloffFile),
        parseCSV(disputedFile)
    ]);

    let activeAgents = ROSTER.filter(agent => !EXCLUDED.includes(agent));

    let metrics = {};
    activeAgents.forEach(agent => {
        metrics[agent] = { open: 0, cooloff: 0, disputed: 0, slaList: [] };
    });

    const agentKeys = ["assignee", "agent", "name", "assignee name", "solved by", "agent name", "user", "submitter", "updater"];
    const timeKeys = ["assignee updated", "updated", "updated at", "solved at", "requested", "created at", "timestamp", "date", "created date", "created"];
    const statusKeys = ["ticket status", "status"];
    const slaKeys = ["sla", "sla time", "time remaining", "remaining sla", "due in", "expires in", "sla status"];

    let refTimeMs = extractRefTimeFromFilename(openFile, openData);

    openData.forEach(row => {
        let agent = getVal(row, agentKeys);
        let status = getVal(row, statusKeys);
        let slaStr = getVal(row, slaKeys);

        let matchedAgent = activeAgents.find(a => a.toLowerCase() === agent.toLowerCase());
        if (matchedAgent && (status.toLowerCase() === "open" || status === "")) {
            metrics[matchedAgent].open++;
            
            let slaObj = parseAnySLA(slaStr, refTimeMs);
            if (slaObj) {
                metrics[matchedAgent].slaList.push(slaObj);
            }
        }
    });

    cooloffData.forEach(row => {
        let agent = getVal(row, agentKeys);
        let status = getVal(row, statusKeys);

        let matchedAgent = activeAgents.find(a => a.toLowerCase() === agent.toLowerCase());
        if (matchedAgent && (status.toLowerCase() === "cool off" || status === "")) {
            metrics[matchedAgent].cooloff++;
        }
    });

    const validDisputeStatuses = ['successful', 'unsuccessful', 'denied', 'already refunded', 'cool off', 'escalated', 'expired'];

    disputedData.forEach(row => {
        let agent = getVal(row, agentKeys);
        let timeStr = getVal(row, timeKeys);
        let status = getVal(row, statusKeys).toLowerCase();

        let matchedAgent = activeAgents.find(a => a.toLowerCase() === agent.toLowerCase());
        
        if (matchedAgent) {
            const isValidStatus = status === "" || validDisputeStatuses.includes(status);
            
            if (isValidStatus && isSamePHTShiftDay(timeStr, filterDay)) {
                metrics[matchedAgent].disputed++;
            }
        }
    });

    lastResults = activeAgents.map(agent => {
        let open = metrics[agent].open;
        let cool = metrics[agent].cooloff;
        let disp = metrics[agent].disputed;
        let slaList = metrics[agent].slaList;
        let totalProcessed = open + cool + disp;
        let needed = quota - totalProcessed;

        slaList.sort((a, b) => a.minutes - b.minutes);

        let slaSummary = "-";
        let isUrgent = false;

        if (slaList.length === 1) {
            slaSummary = slaList[0].label;
            if (slaList[0].minutes <= 60) isUrgent = true;
        } else if (slaList.length > 1) {
            let lowest = slaList[0].label;
            let highest = slaList[slaList.length - 1].label;

            slaSummary = (lowest === highest) ? lowest : `${lowest} - ${highest}`;
            if (slaList[0].minutes <= 60) isUrgent = true;
        }

        return { agent, open, cool, disp, needed, slaSummary, isUrgent, totalProcessed };
    }).sort((a, b) => b.disp - a.disp);

    renderTable(lastResults);
}

function exportForTampermonkey() {
    const queue = lastResults
        .filter(r => r.needed > 0)
        .map(r => ({ agent: r.agent, count: r.needed }));

    const dayVal = document.getElementById('filterDay').value || 'export';
    const blob = new Blob([JSON.stringify(queue, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `agent_assignment_queue_day_${dayVal}.json`;
    a.click();
    URL.revokeObjectURL(url);
}

function renderTable(data) {
    let html = `<div class="export-container">
        <button onclick="exportForTampermonkey()" class="btn-export">
            📥 Export Tampermonkey Queue JSON
        </button>
    </div>`;

    html += `<table id="resultsTable">
        <thead>
            <tr>
                <th class="text-left">Assignee</th>
                <th>Open Tickets</th>
                <th>Cool Off Tickets</th>
                <th>Total Tickets Disputed</th>
                <th>Needed Tickets</th>
                <th>SLA</th>
            </tr>
        </thead>
        <tbody>`;

    data.forEach(r => {
        let neededColor = r.needed < 0 ? '#ff453a' : '#30d158';
        let badgeClass = r.isUrgent ? 'sla-badge urgent' : 'sla-badge';

        let slaHtml = r.slaSummary !== "-" 
            ? `<div class="sla-container"><span class="${badgeClass}">${r.slaSummary}</span></div>` 
            : `<span style="color: #666;">-</span>`;

        html += `<tr>
            <td class="text-left">${r.agent}</td>
            <td>${r.open}</td>
            <td>${r.cool}</td>
            <td><b>${r.disp}</b></td>
            <td><span style="color:${neededColor}; font-weight:bold;">${r.needed}</span></td>
            <td>${slaHtml}</td>
        </tr>`;
    });

    html += `</tbody></table>`;
    document.getElementById('output').innerHTML = html;
}
</script>
</body>
</html>
