<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATOM Daily Tracker - TV Wallboard</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23121212'/><text x='50%' y='68%' font-family='sans-serif' font-weight='900' font-size='52' fill='%23D1C2A5'>DT</text></svg>">

  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: #121215;
      --border-color: #27272a;
      --brand-beige: #e2d4bc;
      --brand-accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      /* Crisp TV Spreadsheet Colors */
      --gs-header-assignee-bg: #c7d8ed;
      --gs-header-metrics-bg: #5f7a9f;
      --gs-header-total-bg: #3f587a;
      --gs-row-even: #f8fafc;
      --gs-row-odd: #ffffff;
      --gs-border: #cbd5e1;
      --gs-text: #0f172a;
      --gs-total-bg: #1e293b;
      --gs-winrate-accent: #15803d;
    }

    * { box-sizing: border-box; }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
      background-color: var(--bg-color); 
      color: var(--text-main);
      margin: 0;
      padding: 12px 18px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      -webkit-font-smoothing: antialiased;
    }

    /* TOP TV STATUS BAR */
    .brand-header {
      width: 98vw;
      max-width: 1920px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border-color);
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-title {
      font-weight: 900;
      font-size: 24px;
      letter-spacing: 2px;
      color: var(--brand-beige);
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      border-left: 2px solid #334155;
      padding-left: 12px;
    }

    .status-badge {
      font-size: 13px;
      color: #4ade80;
      background: #18181b;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #27272a;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* MAIN TV CARD CONTAINER (EXPANDED TO FULL WIDTH) */
    .card { 
      background: var(--card-bg); 
      padding: 14px 18px; 
      border-radius: 8px; 
      border: 1px solid var(--border-color);
      width: 98vw;
      max-width: 1920px; 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .card-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e293b;
    }

    .card-title {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 22px;
      background-color: var(--brand-beige);
      border-radius: 2px;
    }

    .report-meta {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 600;
      background: #18181b;
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid #27272a;
    }

    /* DISTANCE-READABLE SPREADSHEET TABLE */
    .table-container {
      width: 100%;
      overflow-x: hidden;
      background-color: #ffffff;
      border-radius: 6px;
      border: 2px solid #64748b;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    table { 
      width: 100%; 
      border-collapse: separate; 
      border-spacing: 0;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }

    th, td { 
      border-right: 1.5px solid var(--gs-border);
      border-bottom: 1.5px solid var(--gs-border);
      padding: 10px 12px; 
      text-align: center !important; 
      font-size: 19px; /* Large, distance readable font */
      line-height: 1.25;
      color: var(--gs-text);
      font-variant-numeric: tabular-nums;
    }

    th { 
      background-color: var(--gs-header-metrics-bg) !important; 
      color: #ffffff !important; 
      padding: 12px 10px; 
      font-weight: 800 !important;
      font-size: 17px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    th.assignee-header {
      background-color: var(--gs-header-assignee-bg) !important;
      color: #0f172a !important;
      font-style: italic;
      text-align: left !important;
      padding-left: 18px;
      font-size: 18px;
      width: 24%;
    }

    th.total-header {
      background-color: var(--gs-header-total-bg) !important;
    }

    tr:nth-child(even) td { 
      background-color: var(--gs-row-even); 
    }
    
    tr:nth-child(odd) td { 
      background-color: var(--gs-row-odd); 
    }

    /* AGENT NAME CELL STYLING */
    .text-left { 
      text-align: left !important; 
      font-weight: 800 !important; 
      color: #0f172a !important;
      padding-left: 18px !important;
      white-space: nowrap;
      font-size: 20px !important;
    }

    /* METRIC CELL STYLING */
    .metric-num {
      font-weight: 700;
      font-size: 20px;
    }

    .total-disputed-cell {
      font-weight: 900 !important;
      font-size: 22px !important;
      background-color: #f1f5f9 !important;
      color: #0284c7 !important;
    }

    .winrate-cell {
      font-weight: 900 !important;
      font-size: 21px !important;
      color: var(--gs-winrate-accent) !important;
    }

    /* GRAND TOTAL SUMMARY ROW */
    .summary-row td { 
      font-weight: 900 !important; 
      background-color: var(--gs-total-bg) !important; 
      color: #ffffff !important;
      border-top: 3px solid #000000 !important;
      border-bottom: 3px solid #000000 !important;
      padding: 13px 12px;
      font-size: 22px !important;
    }

    .summary-row td.text-left {
      color: #ffffff !important;
      font-size: 22px !important;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .summary-row .total-disputed-cell {
      background-color: #0f172a !important;
      color: #38bdf8 !important;
    }

    .summary-row .winrate-cell {
      color: #4ade80 !important;
    }

    .empty-state {
      padding: 50px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 18px;
      font-weight: 600;
      background: #18181b;
      border-radius: 4px;
    }

    .brand-footer {
      margin-top: 14px;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- TV TOP BAR -->
  <div class="brand-header">
    <div class="brand-left">
      <div class="brand-title">ATOMS Daily Tracker</div>
      <div class="brand-subtitle">Operations Live Board</div>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="badgeText">Live Feed Active</span>
    </div>
  </div>

  <!-- TABLE CONTAINER -->
  <div class="card">
    <div class="card-top-bar">
      <div>
        <div class="card-title" id="reportTitle">Daily Ticket Summary</div>
      </div>
      <div class="report-meta" id="reportMeta">Connecting live stream...</div>
    </div>

    <div class="table-container" id="output">
      <div class="empty-state">Waiting for report upload from Admin...</div>
    </div>
  </div>

  <div class="brand-footer">
    ATOMS Operations &bull; Real-Time Operations Display &copy; 2026
  </div>

<script>
const SYNC_TOPIC = "ywbisa_tracker_live_sync";
let lastChecksum = "";

// TV-OPTIMIZED POLLING ENGINE: Unique timestamp prevents browser caching
function pollCloudData() {
  const url = `https://ntfy.sh/${SYNC_TOPIC}/json?poll=1&since=24h&_t=${Date.now()}`;

  if (typeof fetch === 'function') {
    fetch(url)
      .then(res => {
        if (!res.ok) throw new Error("Status " + res.status);
        return res.text();
      })
      .then(text => processResponse(text))
      .catch(() => tryXHR(url));
  } else {
    tryXHR(url);
  }
}

// Built-in fallback for older Smart TV engines
function tryXHR(url) {
  try {
    const xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4 && xhr.status === 200) {
        processResponse(xhr.responseText);
      }
    };
    xhr.send();
  } catch(e) {}
}

function processResponse(rawText) {
  if (!rawText || !rawText.trim()) return;

  const lines = rawText.trim().split('\n');
  for (let i = lines.length - 1; i >= 0; i--) {
    try {
      const item = JSON.parse(lines[i]);
      if (item.event === 'message' && item.message) {
        const payload = (typeof item.message === 'string') ? JSON.parse(item.message) : item.message;
        renderReport(payload);
        break;
      }
    } catch(e) {}
  }
}

function renderReport(payload) {
  if (!payload) return;

  const currentChecksum = JSON.stringify(payload);
  if (currentChecksum === lastChecksum) return; // Prevent screen blinking
  lastChecksum = currentChecksum;

  const meta = document.getElementById('reportMeta');
  const title = document.getElementById('reportTitle');

  if (payload.day) {
    title.textContent = `Daily Ticket Summary — Day ${payload.day} (PHT)`;
  }
  meta.textContent = payload.updatedAt ? `Last Broadcast: ${payload.updatedAt}` : 'Live Report Active';

  const rows = payload.rows || [];
  renderTable(rows);
}

function renderTable(data) {
  const outputDiv = document.getElementById('output');
  if (!data || data.length === 0) {
    outputDiv.innerHTML = `<div class="empty-state">No matching rows found in this report.</div>`;
    return;
  }

  let totals = { succ: 0, den: 0, ref: 0, cool: 0, esc: 0, exp: 0, total: 0 };
  
  let html = `
    <table id="summaryTable">
      <thead>
        <tr>
          <th class="assignee-header">Assignee</th>
          <th>Successful</th>
          <th>Denied</th>
          <th>Already Refunded</th>
          <th>Cool Off</th>
          <th>Escalated</th>
          <th>Expired</th>
          <th class="total-header">Total Order Disputed</th>
          <th>Winrate</th>
        </tr>
      </thead>
      <tbody>
  `;

  data.forEach(row => {
    const s = Number(row.successful) || 0;
    const d = Number(row.denied) || 0;
    const r = Number(row.refunded) || 0;
    const c = Number(row.coolOff) || 0;
    const e = Number(row.escalated) || 0;
    const x = Number(row.expired) || 0;
    
    // EXPIRED IS EXCLUDED FROM TOTAL ORDER DISPUTED
    const t = Number(row.totalDispute) || (s + d + r + c + e); 
    const w = typeof row.winRate === 'number' ? row.winRate.toFixed(2) : parseFloat(row.winRate || 0).toFixed(2);

    totals.succ += s;
    totals.den += d;
    totals.ref += r;
    totals.cool += c;
    totals.esc += e;
    totals.exp += x;
    totals.total += t;

    html += `
      <tr>
        <td class="text-left">${row.name}</td>
        <td class="metric-num">${s}</td>
        <td class="metric-num">${d}</td>
        <td class="metric-num">${r}</td>
        <td class="metric-num">${c}</td>
        <td class="metric-num">${e}</td>
        <td class="metric-num" style="color: #64748b;">${x}</td>
        <td class="total-disputed-cell">${t}</td>
        <td class="winrate-cell">${w}%</td>
      </tr>
    `;
  });

  const overallWinRateDenom = totals.succ + totals.den + totals.cool;
  const overallWinRate = overallWinRateDenom > 0 ? (totals.succ / overallWinRateDenom * 100).toFixed(2) : "0.00";

  html += `
      <tr class="summary-row">
        <td class="text-left">Grand Total</td>
        <td>${totals.succ}</td>
        <td>${totals.den}</td>
        <td>${totals.ref}</td>
        <td>${totals.cool}</td>
        <td>${totals.esc}</td>
        <td style="color: #94a3b8;">${totals.exp}</td>
        <td class="total-disputed-cell">${totals.total}</td>
        <td class="winrate-cell">${overallWinRate}%</td>
      </tr>
    </tbody>
  </table>
  `;

  outputDiv.innerHTML = html;
}

// Initial check on page open
pollCloudData();

// Continual check every 4 seconds
setInterval(pollCloudData, 4000);

// Local tab listener for laptop testing
window.addEventListener('storage', (e) => {
  if (e.key === 'atom_tracker_live_data' && e.newValue) {
    try { renderReport(JSON.parse(e.newValue)); } catch(err) {}
  }
});
try {
  new BroadcastChannel('atom_tracker_live_channel').onmessage = (e) => {
    if (e.data) renderReport(e.data);
  };
} catch(e) {}
</script>
</body>
</html>
